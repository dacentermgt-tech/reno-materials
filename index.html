<script type="text/babel">
const {useState,useEffect,useRef,useCallback}=React;
if (typeof window.storage === "undefined") {
  window.storage = {
    get: async (k) => { try { const v=localStorage.getItem(k); return v?{key:k,value:v}:null; } catch { return null; } },
    set: async (k, v) => { try { localStorage.setItem(k,v); return {key:k,value:v}; } catch { return null; } },
    "delete": async (k) => { try { localStorage.removeItem(k); return {key:k,deleted:true}; } catch { return null; } },
    list: async (p) => { try { const keys=[]; for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(!p||k.startsWith(p))keys.push(k);} return {keys}; } catch { return {keys:[]}; } }
  };
}

const mkItem = () => ({id:"item-"+Date.now(),component:"",room:"",material:"",description:"",vendor:"",brand:"",color:"",finish:"",qty:"",unit:"each",width:"",height:"",depth:"",leadTime:"",notes:"",website:"",photos:[],status:"Draft",unitPrice:"",discount:"",totalPrice:""});

const COL = {component:["item component","component"],room:["room description","room","location","area"],material:["item description","item desc","description","desc"],description:["client description","client desc"],vendor:["vendor id","vendor","supplier"],brand:["brand","manufacturer"],color:["color","colour"],finish:["finish"],qty:["qty","quantity","amount"],unit:["unit","uom"],width:["width"],height:["height"],depth:["depth"],leadTime:["lead time","leadtime"]};

function detectCol(h) {
  const lh=h.toLowerCase().trim();
  for (const [f,al] of Object.entries(COL)){if(al.some(a=>lh===a))return f;}
  for (const [f,al] of Object.entries(COL)){if(al.some(a=>lh.startsWith(a)))return f;}
  for (const [f,al] of Object.entries(COL)){if(al.some(a=>a.length>=4&&lh.includes(a)))return f;}
  return null;
}

function parseExcel(file) {
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=e=>{
      try {
        const wb=XLSX.read(e.target.result,{type:"array"});
        const ws=wb.Sheets[wb.SheetNames[0]];
        const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:""});
        if(rows.length<2){resolve({items:[],warnings:["Sheet empty"]});return;}
        let hi=0;
        for(let i=0;i<Math.min(6,rows.length);i++){if(rows[i].filter(Boolean).length>=2){hi=i;break;}}
        const headers=rows[hi].map(h=>String(h));
        const cm={};
        headers.forEach((h,idx)=>{const f=detectCol(h);if(f&&!(f in cm))cm[f]=idx;});
        const items=[];let skipped=0;
        for(let r=hi+1;r<rows.length;r++){
          const row=rows[r];
          if(row.every(c=>!c))continue;
          const first=String(row[0]||"").toLowerCase().trim();
          if(first==="item component"||first==="component"||first==="item description")continue;
          const get=f=>cm[f]!==undefined?String(row[cm[f]]||"").trim():"";
          const mat=get("material");const desc=get("description");
          if(!mat&&!desc){skipped++;continue;}
          const qty=parseFloat(get("qty").replace(/[^0-9.]/g,""))||"";
          const ur=get("unit");
          items.push({...mkItem(),id:"imp-"+r,component:get("component"),room:get("room"),material:mat||desc,description:mat?desc:"",vendor:get("vendor"),brand:get("brand"),color:get("color"),finish:get("finish"),qty:String(qty),unit:UNITS.includes(ur)?ur:(ur||"each"),width:get("width"),height:get("height"),depth:get("depth"),leadTime:get("leadTime")});
        }
        resolve({items,warnings:skipped?[skipped+" rows skipped"]:[]});
      } catch(err){reject(err);}
    };
    reader.onerror=reject;
    reader.readAsArrayBuffer(file);
  });
}

function buildEmail(project,contactIds,itemIds) {
  const recipients=project.contacts.filter(c=>contactIds.includes(c.id));
  const items=itemIds.length?project.items.filter(it=>itemIds.includes(it.id)):project.items;
  if(!recipients.length||!items.length)return "";
  const toLine=recipients.map(c=>c.name+" <"+c.email+">").join("; ");
  const rows=items.map((it,i)=>{
    const dims=[it.width&&"W:"+it.width,it.height&&"H:"+it.height,it.depth&&"D:"+it.depth].filter(Boolean).join(" x ");
    return [(i+1)+". "+it.material,it.room&&"   Room: "+it.room,it.description&&"   Spec: "+it.description,it.brand&&"   Brand: "+it.brand,it.color&&"   Color: "+it.color,it.finish&&"   Finish: "+it.finish,it.qty&&"   Qty: "+it.qty+" "+it.unit,dims&&"   Dims: "+dims,it.notes&&"   Notes: "+it.notes].filter(Boolean).join("\n");
  }).join("\n\n");
  return "To: "+toLine+"\nSubject: Quote Request - "+project.name+"\n\nDear "+recipients.map(c=>c.name).join(" & ")+",\n\nPlease find our quote request for the following materials for "+project.name+". Kindly provide pricing, availability and lead times.\n\n"+"-".repeat(50)+"\n\n"+rows+"\n\n"+"-".repeat(50)+"\n\nKind regards,\n"+(project.company||"[Your Company]");
}

function StatusSummary({items}) {
  var counts={Draft:0,Ordered:0,Confirmed:0,Delivered:0};
  items.forEach(function(it){if(counts[it.status]!==undefined)counts[it.status]++;});
  var total=items.length;
  if(!total)return null;
  return (
    <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:8,padding:"12px 0 4px"}}>
      {Object.entries(counts).map(function(entry){
        var status=entry[0];var count=entry[1];
        var sc=STATUS_CLR[status]||"#94a3b8";
        var pct=total>0?Math.round(count/total*100):0;
        return (
          <div key={status} style={{background:"#fff",border:"1px solid #e2e8f0",borderRadius:8,padding:"10px 10px 8px",borderTop:"3px solid "+sc}}>
            <div style={{fontSize:18,fontWeight:700,color:"#0f172a"}}>{count}</div>
            <div style={{fontSize:10,color:"#94a3b8",textTransform:"uppercase",letterSpacing:"0.5px"}}>{status}</div>
            <div style={{marginTop:4,height:3,borderRadius:2,background:"#f1f5f9"}}>
              <div style={{width:pct+"%",height:"100%",borderRadius:2,background:sc}}></div>
            </div>
          </div>
        );
      })}
    </div>
  );
}

function FilteredItems({items,search,sortBy,rooms,editId,onEdit,onUpdate,onDelete,selectedItems,onToggleSelect,visibleCols}) {
  var allItems=items;
  if(search&&search.trim()){
    var q=search.toLowerCase();
    allItems=allItems.filter(function(it){return (it.material||"").toLowerCase().includes(q)||(it.room||"").toLowerCase().includes(q)||(it.vendor||"").toLowerCase().includes(q)||(it.brand||"").toLowerCase().includes(q)||(it.description||"").toLowerCase().includes(q)||(it.component||"").toLowerCase().includes(q);});
  }
  if(sortBy&&sortBy!=="none"){
    allItems=[...allItems].sort(function(a,b){var av=(a[sortBy]||"").toLowerCase();var bv=(b[sortBy]||"").toLowerCase();return av<bv?-1:av>bv?1:0;});
  }
  var isFiltered=(search&&search.trim())||(sortBy&&sortBy!=="none");
  var roomList=isFiltered?["Results ("+allItems.length+")"]:rooms;
  if(allItems.length===0&&search&&search.trim()){
    return <div style={{textAlign:"center",padding:"40px 20px",color:"#94a3b8",fontSize:14}}>No items match "{search}"</div>;
  }
  return (
    <div>
      {roomList.map(function(room){
        var roomItems=isFiltered?allItems:allItems.filter(function(it){return (it.room||"Unassigned")===room;});
        return <RoomTable key={room} room={room} items={roomItems} editId={editId} onEdit={onEdit} onUpdate={onUpdate} onDelete={onDelete} selectedItems={selectedItems} onToggleSelect={onToggleSelect} visibleCols={visibleCols}/>;
      })}
    </div>
  );
}

function exportToExcel(active) {
  const rows=active.items.map((it,i)=>({"#":i+1,"Component":it.component||"","Room":it.room||"","Item Description":it.material||"","Client Description":it.description||"","Vendor":it.vendor||"","Brand":it.brand||"","Color":it.color||"","Finish":it.finish||"","Qty":it.qty||"","Unit":it.unit||"","Width":it.width||"","Height":it.height||"","Depth":it.depth||"","Lead Time":it.leadTime||"","Unit Price":it.unitPrice||"","Discount %":it.discount||"","Total Price":it.totalPrice||"","Notes":it.notes||"","Status":it.status||"","Website":it.website||""}));
  const ws=XLSX.utils.json_to_sheet(rows);
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,"Materials");
  XLSX.writeFile(wb,active.name.replace(/[^a-z0-9]/gi,"_")+"_materials.xlsx");
}

<script type="text/babel">
function App() {
  const [projects,setProjects]=useState([]);
  const [activeId,setActiveId]=useState(null);
  const [screen,setScreen]=useState("home");
  const [vendors,setVendors]=useState([]);
  const [apiKey,setApiKey]=useState("");
  const [savedCols,setSavedCols]=useState(null);
  const [loading,setLoading]=useState(true);
  const [saving,setSaving]=useState(false);
  const active=projects.find(p=>p.id===activeId);

  useEffect(()=>{
    (async()=>{
      try{const res=await window.storage.list("proj:");if(res&&res.keys.length){const loaded=[];for(const k of res.keys){try{const r=await window.storage.get(k);if(r)loaded.push(JSON.parse(r.value));}catch{}}loaded.sort((a,b)=>new Date(b.updatedAt)-new Date(a.updatedAt));setProjects(loaded);}}catch{}
      try{const v=await window.storage.get("global:vendors");if(v)setVendors(JSON.parse(v.value));}catch{}
      try{const k=await window.storage.get("global:apikey");if(k)setApiKey(k.value);}catch{}
      try{const vc=await window.storage.get("global:viscols");if(vc)setSavedCols(JSON.parse(vc.value));}catch{}
      setLoading(false);
      try{const params=new URLSearchParams(window.location.search);const pid=params.get("project");if(pid){setActiveId(pid);setScreen("project");}}catch{}
    })();
  },[]);

  const persist=async(proj)=>{setSaving(true);try{await window.storage.set("proj:"+proj.id,JSON.stringify(proj));}catch{}setSaving(false);};
  const persistVendors=async(list)=>{try{await window.storage.set("global:vendors",JSON.stringify(list));}catch{}};
  const saveApiKey=async(key)=>{setApiKey(key);try{await window.storage.set("global:apikey",key);}catch{}};
  const saveVisibleCols=async(cols)=>{setSavedCols(cols);try{await window.storage.set("global:viscols",JSON.stringify(cols));}catch{}};

  const updateActive=useCallback((fn)=>{
    setProjects(prev=>prev.map(p=>{
      if(p.id!==activeId)return p;
      const next={...fn(p),updatedAt:new Date().toISOString()};
      persist(next);return next;
    }));
  },[activeId]);

  if(loading)return <div style={{display:"flex",alignItems:"center",justifyContent:"center",height:"100vh",fontFamily:"system-ui",color:"#64748b",fontSize:14}}>Loading...</div>;

  if(screen==="vendors")return <VendorsScreen vendors={vendors} onBack={()=>setScreen("home")} onChange={(v)=>{setVendors(v);persistVendors(v);}}/>;

  if(screen==="project"&&active)return <ProjectScreen active={active} vendors={vendors} saving={saving} apiKey={apiKey} savedCols={savedCols} onSaveVisibleCols={saveVisibleCols} onBack={()=>{try{window.history.pushState({},"",window.location.pathname);}catch(e){}setScreen("home");}} updateActive={updateActive}/>;

  return <HomeScreen projects={projects} saving={saving} apiKey={apiKey} onSaveApiKey={saveApiKey} onVendors={()=>setScreen("vendors")} onOpen={(id)=>{setActiveId(id);setScreen("project");try{window.history.pushState({},"",window.location.pathname+"?project="+id);}catch(e){}}} onCreateProject={(name,company)=>{const p=mkProject(name,company);setProjects(prev=>[p,...prev]);persist(p);setActiveId(p.id);setScreen("project");try{window.history.pushState({},"",window.location.pathname+"?project="+p.id);}catch(e){}}} onDeleteProject={async(id)=>{try{await window.storage.delete("proj:"+id);}catch{}setProjects(prev=>prev.filter(p=>p.id!==id));}}/>;
}

      <div style={{maxWidth:760,margin:"0 auto",padding:"24px"}}>
        {showSettings&&(
          <div style={{background:"#fff",border:"1px solid #e2e8f0",borderRadius:10,padding:20,marginBottom:16}}>
            <div style={{fontSize:14,fontWeight:600,marginBottom:4,color:"#0f172a"}}>Settings</div>
            <div style={{fontSize:12,color:"#64748b",marginBottom:12}}>Enter your Anthropic API key to enable PDF import. Get one free at console.anthropic.com</div>
            <div style={{display:"flex",gap:8,alignItems:"flex-end"}}>
              <div style={{flex:1}}><label style={lbl}>Anthropic API Key</label><input value={keyInput} onChange={e=>setKeyInput(e.target.value)} type="password" placeholder="sk-ant-..." style={inp}/></div>
              <Btn onClick={()=>{onSaveApiKey(keyInput);setShowSettings(false);}} label="Save" disabled={!keyInput.trim()}/>
              <Btn ghost onClick={()=>setShowSettings(false)} label="Cancel"/>
            </div>
            {apiKey&&<div style={{fontSize:12,color:"#22c55e",marginTop:8}}>API key saved - PDF import enabled</div>}
          </div>
        )}
        {showForm&&(
          <div style={{background:"#fff",border:"1px solid #e2e8f0",borderRadius:10,padding:20,marginBottom:16}}>
            <div style={{fontSize:14,fontWeight:600,marginBottom:12,color:"#0f172a"}}>New Project</div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:12}}>
              <div><label style={lbl}>Project Name *</label><input value={name} onChange={e=>setName(e.target.value)} placeholder="Project name" style={inp}/></div>
              <div><label style={lbl}>Company</label><input value={company} onChange={e=>setCompany(e.target.value)} placeholder="Company name" style={inp}/></div>
            </div>
            <div style={{display:"flex",gap:8}}>
              <Btn onClick={()=>{if(!name.trim())return;onCreateProject(name.trim(),company.trim());setName("");setCompany("");setShowForm(false);}} label="Create Project" disabled={!name.trim()}/>
              <Btn ghost onClick={()=>setShowForm(false)} label="Cancel"/>
            </div>
          </div>
        )}
        <div style={{fontSize:11,fontWeight:600,color:"#94a3b8",letterSpacing:1,textTransform:"uppercase",marginBottom:8}}>Projects ({projects.length})</div>
        {projects.length===0&&<div style={{textAlign:"center",padding:"48px 0",color:"#cbd5e1",fontSize:14}}>No projects yet. Create your first one above.</div>}
        <div style={{display:"flex",flexDirection:"column",gap:6}}>
          {projects.map(p=>{
            const rooms=[...new Set(p.items.map(it=>it.room).filter(Boolean))];
            return (
              <div key={p.id} onClick={()=>onOpen(p.id)} style={{background:"#fff",border:"1px solid #e2e8f0",borderRadius:8,padding:"14px 16px",display:"flex",alignItems:"center",gap:12,cursor:"pointer"}}>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontWeight:600,fontSize:14,color:"#0f172a",marginBottom:2}}>{p.name}</div>
                  <div style={{fontSize:12,color:"#94a3b8"}}>{p.items.length} items{rooms.length?" - "+rooms.slice(0,3).join(", ")+(rooms.length>3?" +more":""):""} - {new Date(p.updatedAt).toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"})}</div>
                  {p.notes&&<div style={{fontSize:12,color:"#94a3b8",marginTop:2,overflow:"hidden",whiteSpace:"nowrap",textOverflow:"ellipsis"}}>{p.notes}</div>}
                  {p.folderUrl&&<div style={{fontSize:12,color:"#3b82f6",marginTop:2}}>Folder linked</div>}
                </div>
                <button onClick={e=>{e.stopPropagation();onDeleteProject(p.id);}} style={{background:"none",border:"none",color:"#cbd5e1",cursor:"pointer",fontSize:14,padding:"2px 6px"}}>x</button>
                <span style={{color:"#cbd5e1",fontSize:18}}>{">"}</span>
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
}

function VendorsScreen({vendors,onBack,onChange}) {
  const [form,setForm]=useState({name:"",email:"",phone:"",type:"vendor"});
  const [showForm,setShowForm]=useState(false);
  return (
    <div style={{fontFamily:"system-ui,sans-serif",background:"#f8fafc",minHeight:"100vh"}}>
      <div style={{background:"#fff",borderBottom:"1px solid #e2e8f0",padding:"0 24px",display:"flex",alignItems:"center",height:56,gap:12}}>
        <button onClick={onBack} style={{background:"none",border:"1px solid #e2e8f0",borderRadius:6,padding:"4px 12px",cursor:"pointer",fontSize:13,color:"#64748b"}}>Back</button>
        <span style={{fontWeight:600,fontSize:15,color:"#0f172a"}}>Vendor Directory</span>
        <div style={{marginLeft:"auto"}}><Btn small onClick={()=>setShowForm(v=>!v)} label={showForm?"Cancel":"+ Add Vendor"}/></div>
      </div>
      <div style={{maxWidth:680,margin:"0 auto",padding:"24px"}}>
        {showForm&&(
          <div style={{background:"#fff",border:"1px solid #e2e8f0",borderRadius:10,padding:16,marginBottom:16}}>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:10}}>
              <div><label style={lbl}>Name *</label><input value={form.name} onChange={e=>setForm(p=>({...p,name:e.target.value}))} placeholder="Name" style={inp}/></div>
              <div><label style={lbl}>Email *</label><input value={form.email} onChange={e=>setForm(p=>({...p,email:e.target.value}))} type="email" placeholder="Email" style={inp}/></div>
              <div><label style={lbl}>Phone</label><input value={form.phone} onChange={e=>setForm(p=>({...p,phone:e.target.value}))} placeholder="Phone" style={inp}/></div>
              <div><label style={lbl}>Type</label><select value={form.type} onChange={e=>setForm(p=>({...p,type:e.target.value}))} style={inp}><option value="vendor">Vendor</option><option value="designer">Designer</option></select></div>
            </div>
            <Btn onClick={()=>{if(!form.name.trim()||!form.email.trim())return;onChange([...vendors,{...form,id:"v-"+Date.now()}]);setForm({name:"",email:"",phone:"",type:"vendor"});setShowForm(false);}} label="Save Vendor" disabled={!form.name.trim()||!form.email.trim()}/>
          </div>
        )}
        {vendors.length===0&&!showForm&&<div style={{textAlign:"center",padding:"40px 0",color:"#cbd5e1",fontSize:14}}>No vendors saved yet.</div>}
        {vendors.map(v=>(
          <div key={v.id} style={{background:"#fff",border:"1px solid #e2e8f0",borderRadius:8,padding:"12px 14px",display:"flex",alignItems:"center",gap:10,marginBottom:6}}>
            <div style={{flex:1}}>
              <div style={{fontWeight:600,fontSize:14,color:"#0f172a"}}>{v.name}</div>
              <div style={{fontSize:12,color:"#94a3b8"}}>{v.email}{v.phone?" - "+v.phone:""}</div>
            </div>
            <span style={{fontSize:11,background:v.type==="vendor"?"#fef3e2":"#eff6ff",color:v.type==="vendor"?"#b45309":"#2563eb",borderRadius:20,padding:"2px 8px"}}>{v.type}</span>
            <button onClick={()=>onChange(vendors.filter(x=>x.id!==v.id))} style={{background:"none",border:"none",color:"#cbd5e1",cursor:"pointer",fontSize:14}}>x</button>
          </div>
        ))}
      </div>
    </div>
  );
}
</script>
<script type="text/babel">
function ProjectScreen({active,vendors,saving,apiKey,savedCols,onSaveVisibleCols,onBack,updateActive}) {
  const [tab,setTab]=useState("items");
  const [editId,setEditId]=useState(null);
  const [importState,setImportState]=useState(null);
  const [importing,setImporting]=useState(false);
  const [parsingPdf,setParsingPdf]=useState(false);
  const [selectedItems,setSelectedItems]=useState([]);
  const [selectedContacts,setSelectedContacts]=useState([]);
  const [emailCopied,setEmailCopied]=useState(false);
  const [showContactForm,setShowContactForm]=useState(false);
  const [showVendorPicker,setShowVendorPicker]=useState(false);
  const [showNotes,setShowNotes]=useState(false);
  const [search,setSearch]=useState("");
  const [sortBy,setSortBy]=useState("none");
  const [showShareMsg,setShowShareMsg]=useState(false);
  const [contactForm,setContactForm]=useState({name:"",email:"",type:"vendor"});
  const [showColPicker,setShowColPicker]=useState(false);
  const [visibleCols,setVisibleCols]=useState(savedCols||["component","material","vendor","brand","width","height","depth","qty","leadTime","status"]);
  const fileRef=useRef();
  const pdfRef=useRef();

  const addItem=()=>{const item=mkItem();updateActive(p=>({...p,items:[...p.items,item]}));setEditId(item.id);setTab("items");};
  const updateItem=(id,patch)=>updateActive(p=>({...p,items:p.items.map(it=>it.id===id?{...it,...patch}:it)}));
  const deleteItem=(id)=>{updateActive(p=>({...p,items:p.items.filter(it=>it.id!==id)}));if(editId===id)setEditId(null);};

  const handleFile=async(e)=>{
    const file=e.target.files&&e.target.files[0];if(!file)return;
    setImporting(true);
    try{const res=await parseExcel(file);setImportState({...res,fileName:file.name});}catch(err){setImportState({items:[],warnings:["Error: "+err.message],fileName:file.name});}
    setImporting(false);e.target.value="";
  };

  const handlePdf=async(e)=>{
    const file=e.target.files&&e.target.files[0];if(!file)return;
    if(!apiKey){alert("Please add your Anthropic API key in Settings first.");return;}
    setParsingPdf(true);
    try{
      const base64=await new Promise((res,rej)=>{const r=new FileReader();r.onload=ev=>res(ev.target.result.split(",")[1]);r.onerror=rej;r.readAsDataURL(file);});
      // Step 1: extract structured text from PDF
      const r1=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json","x-api-key":apiKey,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:16000,messages:[{role:"user",content:[{type:"document",source:{type:"base64",media_type:"application/pdf",data:base64}},{type:"text",text:"Extract all rows from this FF&E or materials schedule table. For each row output one line in this exact format (skip header rows and empty rows):\nCOMPONENT|ROOM|ITEM_DESCRIPTION|VENDOR|CLIENT_DESCRIPTION\n\nOutput ONLY the pipe-separated lines, nothing else."}]}]})});
      const d1=await r1.json();
      if(d1.error)throw new Error(d1.error.message);
      const rawText=d1.content&&d1.content.map(c=>c.text||"").join("").trim();
      if(!rawText)throw new Error("No text extracted from PDF");
      // Step 2: parse the pipe-separated lines into items
      const lines=rawText.split("\n").filter(l=>l.includes("|"));
      if(!lines.length)throw new Error("No table rows found in PDF");
      const items=lines.map((line,i)=>{
        const parts=line.split("|").map(p=>p.trim());
        return {...mkItem(),id:"pdf-"+Date.now()+"-"+i,component:parts[0]||"",room:parts[1]||"",material:parts[2]||"",vendor:parts[3]||"",description:parts[4]||""};
      }).filter(it=>it.material||it.component);
      setImportState({items,warnings:items.length?[]:[rawText.slice(0,200)],fileName:file.name});
    }catch(err){alert("PDF parsing failed: "+err.message);}
    setParsingPdf(false);e.target.value="";
  };

  const applyImport=()=>{if(!importState||!importState.items.length)return;updateActive(p=>({...p,items:[...p.items,...importState.items]}));setImportState(null);};
  const addContact=()=>{if(!contactForm.name.trim()||!contactForm.email.trim())return;const c={...contactForm,id:"c-"+Date.now()};updateActive(p=>({...p,contacts:[...p.contacts,c]}));setShowContactForm(false);setContactForm({name:"",email:"",type:"vendor"});};
  const emailText=active&&selectedItems?buildEmail(active,selectedContacts,selectedItems):"";
  const rooms=[...new Set(active.items.map(it=>it.room||"Unassigned"))];

  return (
    <div style={{fontFamily:"system-ui,sans-serif",background:"#f8fafc",minHeight:"100vh"}}>
      <div style={{background:"#fff",borderBottom:"1px solid #e2e8f0",padding:"0 20px",display:"flex",alignItems:"center",height:52,gap:10,position:"sticky",top:0,zIndex:10}}>
        <button onClick={onBack} style={{background:"none",border:"1px solid #e2e8f0",borderRadius:6,padding:"4px 10px",cursor:"pointer",fontSize:12,color:"#64748b"}}>Back</button>
        <span style={{fontWeight:700,fontSize:14,color:"#0f172a",flex:1,overflow:"hidden",whiteSpace:"nowrap",textOverflow:"ellipsis"}}>{active.name}</span>
        {saving&&<span style={{fontSize:11,color:"#94a3b8"}}>Saving...</span>}
        <button onClick={()=>exportToExcel(active)} style={{...bsty,background:"#f1f5f9",color:"#64748b",fontSize:12}}>Export XLS</button>
        <button onClick={()=>setShowNotes(function(v){return !v;})} style={{...bsty,background:showNotes?"#0f172a":"#f1f5f9",color:showNotes?"#fff":"#64748b",fontSize:12}}>{showNotes?"Hide Notes":"Notes"}</button>
      </div>
      <div style={{background:"#fff",borderBottom:"1px solid #e2e8f0",padding:"0 20px",display:"flex",alignItems:"center",gap:0}}>
        {["items","financial","email","contacts"].map(t=>(
          <button key={t} onClick={()=>{setTab(t);if(t==="email")setSelectedItems(active.items.map(it=>it.id));}} style={{padding:"10px 14px",border:"none",borderBottom:tab===t?"2px solid #0f172a":"2px solid transparent",background:"none",cursor:"pointer",fontSize:13,fontWeight:tab===t?600:400,color:tab===t?"#0f172a":"#64748b",textTransform:"capitalize",whiteSpace:"nowrap"}}>
            {t==="items"?"Items ("+active.items.length+")":t==="financial"?"Financial":t==="email"?"Quote Email":"Contacts ("+active.contacts.length+")"}
          </button>
        ))}
        <div style={{marginLeft:"auto",position:"relative"}}>
          <select onChange={e=>{if(e.target.value){const el=document.getElementById("room-"+e.target.value);if(el)el.scrollIntoView({behavior:"smooth",block:"start"});}e.target.value="";}} style={{fontSize:12,padding:"4px 8px",border:"1px solid #e2e8f0",borderRadius:6,background:"#fff",color:"#64748b",cursor:"pointer"}}>
            <option value="">View Section</option>
            {[...new Set(active.items.map(it=>it.room||"Unassigned"))].map(r=>(
              <option key={r} value={r}>{r} ({active.items.filter(it=>(it.room||"Unassigned")===r).length})</option>
            ))}
          </select>
        </div>
      </div>
      {showNotes&&(
        <div style={{background:"#fffbeb",borderBottom:"1px solid #fde68a",padding:"12px 16px"}}>
          <div style={{maxWidth:1100,margin:"0 auto"}}>
            <div style={{fontSize:11,fontWeight:600,color:"#92400e",textTransform:"uppercase",letterSpacing:"0.5px",marginBottom:6}}>Project Notes</div>
            <textarea value={active.notes||""} onChange={e=>updateActive(function(p){return Object.assign({},p,{notes:e.target.value});})} placeholder="Project description, scope, contacts, site notes..." style={{width:"100%",border:"1px solid #fde68a",borderRadius:6,padding:"8px 10px",fontSize:13,color:"#0f172a",background:"#fff",resize:"vertical",minHeight:60,outline:"none",boxSizing:"border-box",fontFamily:"system-ui,sans-serif",marginBottom:10}}/>
            <div style={{fontSize:11,fontWeight:600,color:"#92400e",textTransform:"uppercase",letterSpacing:"0.5px",marginBottom:4}}>Files / Documents Folder</div>
            <div style={{display:"flex",alignItems:"center",gap:8}}>
              <div style={{flex:1,minWidth:0}}>
                <FolderInput value={active.folderUrl||""} onSave={url=>updateActive(function(p){return Object.assign({},p,{folderUrl:url});})}/>
              </div>
              {active.folderUrl&&(
                <a href={active.folderUrl.startsWith("http")?active.folderUrl:"https://"+active.folderUrl} target="_blank" rel="noreferrer" style={{flexShrink:0,padding:"7px 12px",background:"#92400e",color:"#fff",borderRadius:6,fontSize:12,fontWeight:500,textDecoration:"none",whiteSpace:"nowrap"}}>Open</a>
              )}
            </div>
          </div>
        </div>
      )}
      <div style={{maxWidth:1100,margin:"0 auto",padding:"0 16px 60px"}}>

        {tab==="items"&&(
          <div>
            <StatusSummary items={active.items}/>
            <div style={{display:"flex",alignItems:"center",gap:8,padding:"10px 0 6px",flexWrap:"wrap"}}>
              <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search items..." style={{flex:1,minWidth:140,border:"1px solid #e2e8f0",borderRadius:6,padding:"6px 10px",fontSize:13,outline:"none",background:"#fff"}}/>
              <select value={sortBy} onChange={e=>setSortBy(e.target.value)} style={{border:"1px solid #e2e8f0",borderRadius:6,padding:"6px 8px",fontSize:12,color:"#64748b",background:"#fff",outline:"none"}}>
                <option value="none">Sort: Default</option>
                <option value="status">Sort: Status</option>
                <option value="room">Sort: Room</option>
                <option value="vendor">Sort: Vendor</option>
                <option value="material">Sort: Name</option>
              </select>
              <button onClick={()=>{copyText(window.location.href);setShowShareMsg(true);setTimeout(()=>setShowShareMsg(false),2500);}} style={{...bsty,background:showShareMsg?"#22c55e":"#f1f5f9",color:showShareMsg?"#fff":"#64748b",fontSize:12,whiteSpace:"nowrap"}}>{showShareMsg?"Copied!":"Copy Link"}</button>
            </div>
            <div style={{display:"flex",alignItems:"center",gap:8,padding:"0 0 10px",flexWrap:"wrap"}}>
              <Btn small onClick={addItem} label="+ Add Item"/>
              <input ref={fileRef} type="file" accept=".xlsx,.xls,.csv" style={{display:"none"}} onChange={handleFile}/>
              <Btn small ghost onClick={()=>fileRef.current&&fileRef.current.click()} label={importing?"Reading...":"Import Excel"}/>
              <input ref={pdfRef} type="file" accept="application/pdf" style={{display:"none"}} onChange={handlePdf}/>
              <Btn small ghost onClick={()=>pdfRef.current&&pdfRef.current.click()} label={parsingPdf?"Reading PDF...":"Import PDF"}/>
              <Btn small ghost onClick={()=>setShowColPicker(v=>!v)} label="Columns"/>
              {!apiKey&&<span style={{fontSize:11,color:"#f59e0b"}}>Add API key in Settings (home screen) to enable PDF import</span>}
            </div>
            {showColPicker&&(
              <div style={{background:"#fff",border:"1px solid #e2e8f0",borderRadius:8,padding:"12px 14px",marginBottom:10}}>
                <div style={{fontSize:12,fontWeight:600,color:"#0f172a",marginBottom:8}}>Toggle visible columns</div>
                <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
                  {[{id:"component",label:"Component"},{id:"material",label:"Item Desc"},{id:"description",label:"Client Desc"},{id:"vendor",label:"Vendor"},{id:"brand",label:"Brand"},{id:"color",label:"Color"},{id:"finish",label:"Finish"},{id:"width",label:"Width"},{id:"height",label:"Height"},{id:"depth",label:"Depth"},{id:"qty",label:"Qty"},{id:"leadTime",label:"Lead Time"},{id:"status",label:"Status"},{id:"notes",label:"Notes"}].map(col=>{
                    const on=visibleCols.includes(col.id);
                    return <button key={col.id} onClick={()=>{var next=on?visibleCols.filter(c=>c!==col.id):[...visibleCols,col.id];setVisibleCols(next);onSaveVisibleCols(next);}} style={{fontSize:12,borderRadius:20,padding:"3px 10px",border:on?"none":"0.5px solid #e2e8f0",background:on?"#0f172a":"#f8fafc",color:on?"#fff":"#64748b",cursor:"pointer"}}>{col.label}</button>;
                  })}
                </div>
              </div>
            )}

            {importState&&(
              <div style={{background:"#f0fdf4",border:"1px solid #bbf7d0",borderRadius:8,padding:12,marginBottom:12}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}>
                  <span style={{fontSize:13,fontWeight:600,color:"#166534"}}>{importState.fileName} - {importState.items.length} items found</span>
                  <button onClick={()=>setImportState(null)} style={{background:"none",border:"none",color:"#94a3b8",cursor:"pointer",fontSize:16}}>x</button>
                </div>
                {importState.warnings&&importState.warnings.map((w,i)=><div key={i} style={{fontSize:12,color:"#d97706"}}>Warning: {w}</div>)}
                <div style={{maxHeight:120,overflowY:"auto",margin:"8px 0"}}>
                  {importState.items.slice(0,5).map((it,i)=><div key={i} style={{fontSize:12,color:"#374151",padding:"2px 0"}}>{it.material}{it.room?" - "+it.room:""}</div>)}
                  {importState.items.length>5&&<div style={{fontSize:12,color:"#94a3b8"}}>+{importState.items.length-5} more...</div>}
                </div>
                <div style={{display:"flex",gap:8}}>
                  <Btn small onClick={applyImport} label={"Add "+importState.items.length+" items"}/>
                  <Btn small ghost onClick={()=>setImportState(null)} label="Discard"/>
                </div>
              </div>
            )}
            {active.items.length===0&&(
              <div style={{textAlign:"center",padding:"60px 20px",color:"#cbd5e1"}}>
                <div style={{fontSize:32,marginBottom:8}}>[ ]</div>
                <div style={{fontSize:14}}>No items yet. Import from Excel/PDF or add manually.</div>
              </div>
            )}
            <FilteredItems items={active.items} search={search} sortBy={sortBy} rooms={rooms} editId={editId} onEdit={setEditId} onUpdate={updateItem} onDelete={deleteItem} selectedItems={selectedItems} onToggleSelect={(id)=>setSelectedItems(s=>s.includes(id)?s.filter(x=>x!==id):[...s,id])} visibleCols={visibleCols}/>
          </div>
        )}

        {tab==="financial"&&(
          <FinancialTab items={active.items}/>
        )}

        {tab==="email"&&(
          <div style={{paddingTop:16}}>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:12}}>
              <div style={{background:"#fff",border:"1px solid #e2e8f0",borderRadius:8,padding:14}}>
                <div style={{fontSize:13,fontWeight:600,color:"#0f172a",marginBottom:10}}>Recipients</div>
                {active.contacts.length===0&&<div style={{fontSize:13,color:"#94a3b8"}}>No contacts yet - go to Contacts tab.</div>}
                {active.contacts.map(c=>(
                  <label key={c.id} style={{display:"flex",alignItems:"center",gap:8,padding:"6px 0",cursor:"pointer",borderBottom:"1px solid #f1f5f9"}}>
                    <input type="checkbox" checked={selectedContacts.includes(c.id)} onChange={()=>setSelectedContacts(s=>s.includes(c.id)?s.filter(x=>x!==c.id):[...s,c.id])} style={{accentColor:"#0f172a"}}/>
                    <div style={{flex:1}}>
                      <div style={{fontSize:13,fontWeight:500,color:"#0f172a"}}>{c.name}</div>
                      <div style={{fontSize:11,color:"#94a3b8"}}>{c.email}</div>
                    </div>
                    <span style={{fontSize:10,background:c.type==="vendor"?"#fef3e2":"#eff6ff",color:c.type==="vendor"?"#b45309":"#2563eb",borderRadius:20,padding:"1px 7px"}}>{c.type}</span>
                  </label>
                ))}
              </div>
              <div style={{background:"#fff",border:"1px solid #e2e8f0",borderRadius:8,padding:14}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
                  <span style={{fontSize:13,fontWeight:600,color:"#0f172a"}}>Items ({selectedItems.length} selected)</span>
                  <button onClick={()=>setSelectedItems(s=>s.length===active.items.length?[]:active.items.map(it=>it.id))} style={{fontSize:12,color:"#64748b",background:"none",border:"none",cursor:"pointer"}}>{selectedItems.length===active.items.length?"Deselect all":"Select all"}</button>
                </div>
                <div style={{maxHeight:200,overflowY:"auto"}}>
                  {active.items.map(it=>{
                    const checked=selectedItems.includes(it.id);

                <div style={{display:"flex",gap:8}}>
                  <button onClick={()=>{const r=active.contacts.filter(c=>selectedContacts.includes(c.id));const to=r.map(c=>c.email).join(";");window.location.href="mailto:"+to+"?subject="+encodeURIComponent("Quote Request - "+active.name)+"&body="+encodeURIComponent(emailText);}} style={{...bsty,background:"#0f172a",color:"#fff"}}>Open in Outlook</button>
                  <button onClick={()=>{copyText(emailText);setEmailCopied(true);setTimeout(()=>setEmailCopied(false),2000);}} style={{...bsty,background:emailCopied?"#22c55e":"#f1f5f9",color:emailCopied?"#fff":"#0f172a"}}>{emailCopied?"Copied!":"Copy"}</button>
                </div>
              </div>
              <pre style={{fontFamily:"monospace",fontSize:12,lineHeight:1.6,color:"#374151",whiteSpace:"pre-wrap",wordBreak:"break-word",background:"#f8fafc",borderRadius:6,padding:12,border:"1px solid #e2e8f0",maxHeight:320,overflowY:"auto",margin:0}}>{emailText||"Select recipients and items above to preview."}</pre>
            </div>
          </div>
        )}

        {tab==="contacts"&&(
          <div style={{paddingTop:16}}>
            <div style={{display:"flex",gap:8,marginBottom:12}}>
              {vendors.length>0&&<Btn small ghost onClick={()=>setShowVendorPicker(v=>!v)} label="Add from Directory"/>}
              <Btn small ghost onClick={()=>setShowContactForm(v=>!v)} label={showContactForm?"Cancel":"+ New Contact"}/>

            {showVendorPicker&&(
              <div style={{background:"#fffbeb",border:"1px solid #fde68a",borderRadius:8,padding:12,marginBottom:12}}>

                {vendors.map(v=>{const already=active.contacts.some(c=>c.email===v.email);return(
                  <div key={v.id} style={{display:"flex",alignItems:"center",gap:10,padding:"6px 0",borderBottom:"1px solid #fde68a"}}>
                    <div style={{flex:1}}><span style={{fontSize:13,fontWeight:500}}>{v.name}</span><span style={{fontSize:12,color:"#94a3b8",marginLeft:8}}>{v.email}</span></div>
                    <button onClick={()=>{if(!already){const c={...v,id:"c-"+Date.now()};updateActive(p=>({...p,contacts:[...p.contacts,c]}));}}} disabled={already} style={{...bsty,background:already?"#f1f5f9":"#0f172a",color:already?"#94a3b8":"#fff",cursor:already?"default":"pointer"}}>{already?"Added":"Add"}</button>
                  </div>

              <div style={{background:"#fff",border:"1px solid #e2e8f0",borderRadius:8,padding:14,marginBottom:12}}>
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:10}}>
                  <div><label style={lbl}>Name *</label><input value={contactForm.name} onChange={e=>setContactForm(p=>({...p,name:e.target.value}))} placeholder="Name" style={inp}/></div>
                  <div><label style={lbl}>Email *</label><input value={contactForm.email} onChange={e=>setContactForm(p=>({...p,email:e.target.value}))} type="email" placeholder="Email" style={inp}/></div>
                  <div style={{gridColumn:"1/-1"}}><label style={lbl}>Type</label><select value={contactForm.type} onChange={e=>setContactForm(p=>({...p,type:e.target.value}))} style={inp}><option value="vendor">Vendor</option><option value="designer">Designer</option></select></div>
                </div>

      </div>
    </div>
  );
}

function useIsMobile() {
  const [isMobile,setIsMobile]=useState(function(){return typeof window!=="undefined"&&window.innerWidth<768;});
  useEffect(function(){
    function check(){setIsMobile(window.innerWidth<768);}
    window.addEventListener('resize',check);
    check();
    return function(){window.removeEventListener('resize',check);};
  },[]);
  return isMobile;
}
</script>
<script type="text/babel">

function PhotoUpload({item,onUpdate}) {
  const [uploading,setUploading]=useState(false);
  const [lightbox,setLightbox]=useState(null);
  const [dragging,setDragging]=useState(false);
  const fileRef=useRef();
  const photos=item.photos||[];

  const handleDrop=async function(e){
    e.preventDefault();e.stopPropagation();setDragging(false);
    const files=e.dataTransfer&&e.dataTransfer.files;
    if(files&&files.length)upload(files);
  };
  const handleDragOver=function(e){e.preventDefault();e.stopPropagation();setDragging(true);};
  const handleDragLeave=function(e){e.preventDefault();setDragging(false);};

  const upload=async(files)=>{
    if(!files||!files.length)return;
    setUploading(true);
    try{
      const uploaded=[];
      if(hasFirebase()){
        const sref=firebase.storage().ref();
        for(const file of Array.from(files)){
          const ext=file.name.split(".").pop();
          const path="items/"+item.id+"/"+Date.now()+"_"+Math.random().toString(36).slice(2)+"."+ext;
          const ref=sref.child(path);
          await ref.put(file);
          const url=await ref.getDownloadURL();
          uploaded.push({url,path,name:file.name});
        }
      }else{
        for(const file of Array.from(files)){
          const url=await new Promise((res,rej)=>{const r=new FileReader();r.onload=e=>res(e.target.result);r.onerror=rej;r.readAsDataURL(file);});
          uploaded.push({url,path:"local_"+Date.now()+"_"+file.name,name:file.name});
        }
      }
      onUpdate({photos:[...photos,...uploaded]});
    }catch(e){alert("Upload failed: "+e.message);}
    setUploading(false);
    if(fileRef.current)fileRef.current.value="";
  };

  const remove=async(photo)=>{
    try{if(hasFirebase()&&!photo.path.startsWith("local_")){await firebase.storage().ref(photo.path).delete();}}catch{}
    onUpdate({photos:photos.filter(p=>p.path!==photo.path)});
  };

  return (
    <div>
      {photos.length>0&&(
        <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:8}}>
          {photos.map((ph,i)=>(
            <div key={ph.path} style={{position:"relative",width:56,height:56}}>
              <img src={ph.url} alt="" onClick={()=>setLightbox(i)} style={{width:56,height:56,objectFit:"cover",borderRadius:6,cursor:"pointer",border:"1px solid #e2e8f0"}}/>
              <button onClick={()=>remove(ph)} style={{position:"absolute",top:-5,right:-5,width:16,height:16,borderRadius:"50%",background:"#ef4444",border:"none",color:"#fff",fontSize:9,cursor:"pointer",padding:0,lineHeight:1}}>x</button>
            </div>
          ))}
        </div>
      )}
      <input ref={fileRef} type="file" accept="image/*" multiple style={{display:"none"}} onChange={e=>upload(e.target.files)}/>
      <div onDrop={handleDrop} onDragOver={handleDragOver} onDragLeave={handleDragLeave} onClick={()=>fileRef.current&&fileRef.current.click()} style={{display:"flex",alignItems:"center",justifyContent:"center",gap:8,padding:"10px 16px",border:"2px dashed "+(dragging?"#3b82f6":"#e2e8f0"),borderRadius:8,background:dragging?"#eff6ff":"#f8fafc",cursor:"pointer",transition:"all 0.15s",color:dragging?"#3b82f6":"#64748b",fontSize:13}}>
        {uploading?"Uploading...":(dragging?"Drop to upload":photos.length>0?"+ Add more photos ("+photos.length+" saved)":"+ Add photos or drag & drop")}
      </div>
      {lightbox!==null&&(
        <div onClick={()=>setLightbox(null)} style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.9)",zIndex:1000,display:"flex",alignItems:"center",justifyContent:"center",flexDirection:"column",gap:10}}>
          <button onClick={()=>setLightbox(null)} style={{position:"absolute",top:16,right:16,background:"none",border:"none",color:"#fff",fontSize:24,cursor:"pointer"}}>x</button>
          <img src={photos[lightbox]&&photos[lightbox].url} alt="" onClick={e=>e.stopPropagation()} style={{maxWidth:"90vw",maxHeight:"75vh",borderRadius:8,objectFit:"contain"}}/>
          {photos.length>1&&(
            <div style={{display:"flex",gap:8,alignItems:"center"}}>
              <button onClick={e=>{e.stopPropagation();setLightbox(l=>(l-1+photos.length)%photos.length);}} style={{background:"rgba(255,255,255,0.2)",border:"none",color:"#fff",fontSize:20,borderRadius:6,padding:"4px 12px",cursor:"pointer"}}>{"<"}</button>
              <span style={{color:"#fff",fontSize:13}}>{lightbox+1}/{photos.length}</span>
              <button onClick={e=>{e.stopPropagation();setLightbox(l=>(l+1)%photos.length);}} style={{background:"rgba(255,255,255,0.2)",border:"none",color:"#fff",fontSize:20,borderRadius:6,padding:"4px 12px",cursor:"pointer"}}>{">"}</button>
            </div>
          )}
        </div>
      )}
    </div>
  );
}
const root=ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
</script>
</body></html>
