<!DOCTYPE html>
<html><head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>RenoMaterials</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
</head><body>
<div id="root"></div>
<script>
const firebaseConfig={apiKey:"AIzaSyA4ODk4lki5NiLgjQyfZN961rhkmcTPAuc",authDomain:"reno-materials-order-form.firebaseapp.com",projectId:"reno-materials-order-form",storageBucket:"reno-materials-order-form.firebasestorage.app",messagingSenderId:"182946152456",appId:"1:182946152456:web:c513f3862d020642acd1bd"};
firebase.initializeApp(firebaseConfig);
const db=firebase.firestore();
const COLL="storage";
function ekey(k){return k.replace(/[/]/g,"__S__");}
window.storage={
  get:async function(k){try{var d=await db.collection(COLL).doc(ekey(k)).get();if(!d.exists)return null;return{key:k,value:d.data().value};}catch(e){return null;}},
  set:async function(k,v){try{await db.collection(COLL).doc(ekey(k)).set({key:k,value:v,ts:Date.now()});return{key:k,value:v};}catch(e){return null;}},
  remove:async function(k){try{await db.collection(COLL).doc(ekey(k)).delete();return{key:k,deleted:true};}catch(e){return null;}},
  list:async function(p){try{var q=db.collection(COLL);if(p)q=q.where("key",">=",p).where("key","<",p+"\uf8ff");var s=await q.get();return{keys:s.docs.map(function(d){return d.data().key;}).filter(function(k){return !p||k.startsWith(p);})};}catch(e){return{keys:[]};}}
};
</script>
<script type="text/babel">
const {useState}=React;
function App() {
  const [msg, setMsg] = useState("Loading...");
  React.useEffect(()=>{
    window.storage.set("test","hello").then(()=>{
      return window.storage.get("test");
    }).then(r=>{
      setMsg(r ? "Firebase works! Value: "+r.value : "No value returned");
    }).catch(e=>{
      setMsg("Error: "+e.message);
    });
  },[]);
  return <div style={{padding:40,fontFamily:"system-ui",fontSize:18}}>{msg}</div>;
}
const root=ReactDOM.createRoot(document.getElementById("root"));
root.render(<App/>);
</script>
</body></html>
