    set: async function(k,v) { try { localStorage.setItem(k,v); return {key:k,value:v}; } catch(e) { return null; } },

function timeAgo(iso) {
  if(!iso)return "";
  var diff=Date.now()-new Date(iso).getTime();
  var mins=Math.floor(diff/60000);
  var hours=Math.floor(diff/3600000);
  var days=Math.floor(diff/86400000);
  if(mins<1)return "just now";
  if(mins<60)return mins+"m ago";
  if(hours<24)return hours+"h ago";
  if(days===1)return "Yesterday";
  if(days<7)return days+" days ago";
  return new Date(iso).toLocaleDateString("en-US",{month:"short",day:"numeric"});
}

const COL_DEFS_MAP = {component:["item component","component"],room:["room description","room","location","area"],material:["item description","item desc","description","desc"],description:["client description","client desc"],vendor:["vendor id","vendor","supplier"],brand:["brand","manufacturer"],color:["color","colour"],finish:["finish"],qty:["qty","quantity","amount"],unit:["unit","uom"],width:["width"],height:["height"],depth:["depth"],leadTime:["lead time","leadtime"]};

function detectCol(h) {
  var lh=h.toLowerCase().trim();
  var entries=Object.entries(COL_DEFS_MAP);
  for(var i=0;i<entries.length;i++){var f=entries[i][0];var al=entries[i][1];for(var j=0;j<al.length;j++){if(lh===al[j])return f;}}
  for(var i=0;i<entries.length;i++){var f=entries[i][0];var al=entries[i][1];for(var j=0;j<al.length;j++){if(lh.startsWith(al[j]))return f;}}
  for(var i=0;i<entries.length;i++){var f=entries[i][0];var al=entries[i][1];for(var j=0;j<al.length;j++){if(al[j].length>=4&&lh.includes(al[j]))return f;}}
  return null;
}

function parseExcel(file) {
  return new Promise(function(resolve,reject) {
    var reader=new FileReader();
    reader.onload=function(e) {
      try {
        var wb=XLSX.read(e.target.result,{type:"array"});
        var ws=wb.Sheets[wb.SheetNames[0]];
        var rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:""});
        if(rows.length<2){resolve({items:[],warnings:["Sheet empty"]});return;}
        var hi=0;
        for(var i=0;i<Math.min(6,rows.length);i++){if(rows[i].filter(Boolean).length>=2){hi=i;break;}}
        var headers=rows[hi].map(function(h){return String(h);});
        var cm={};
        headers.forEach(function(h,idx){var f=detectCol(h);if(f&&!(f in cm))cm[f]=idx;});
        var items=[];var skipped=0;
        for(var r=hi+1;r<rows.length;r++){
          var row=rows[r];
          if(row.every(function(c){return !c;}))continue;
          var first=String(row[0]||"").toLowerCase().trim();
          if(first==="item component"||first==="component"||first==="item description")continue;
          var get=function(f){return cm[f]!==undefined?String(row[cm[f]]||"").trim():"";};
          var mat=get("material");var desc=get("description");
          if(!mat&&!desc){skipped++;continue;}
          var qty=parseFloat(get("qty").replace(/[^0-9.]/g,""))||"";
          var ur=get("unit");
          items.push(Object.assign(mkItem(),{id:"imp-"+r,component:get("component"),room:get("room"),material:mat||desc,description:mat?desc:"",vendor:get("vendor"),brand:get("brand"),color:get("color"),finish:get("finish"),qty:String(qty),unit:UNITS.includes(ur)?ur:(ur||"each"),width:get("width"),height:get("height"),depth:get("depth"),leadTime:get("leadTime")}));
        }
        resolve({items:items,warnings:skipped?[skipped+" rows skipped"]:[]});
      } catch(err){reject(err);}
    };
    reader.onerror=reject;
    reader.readAsArrayBuffer(file);
  });
}

function buildEmail(project,contactIds,itemIds) {
  var recipients=project.contacts.filter(function(c){return contactIds.includes(c.id);});
  var items=itemIds.length?project.items.filter(function(it){return itemIds.includes(it.id);}):project.items;
  if(!recipients.length||!items.length)return "";
  var toLine=recipients.map(function(c){return c.name+" <"+c.email+">";}).join("; ");
  var rows=items.map(function(it,i){
    var dims=[it.width&&"W:"+it.width,it.height&&"H:"+it.height,it.depth&&"D:"+it.depth].filter(Boolean).join(" x ");
    return [(i+1)+". "+it.material,it.room&&"   Room: "+it.room,it.description&&"   Spec: "+it.description,it.brand&&"   Brand: "+it.brand,it.color&&"   Color: "+it.color,it.finish&&"   Finish: "+it.finish,it.qty&&"   Qty: "+it.qty+" "+it.unit,dims&&"   Dims: "+dims,it.notes&&"   Notes: "+it.notes].filter(Boolean).join("\n");
  }).join("\n\n");
  return "To: "+toLine+"\nSubject: Quote Request - "+project.name+"\n\nDear "+recipients.map(function(c){return c.name;}).join(" & ")+",\n\nPlease find our quote request for the following materials for "+project.name+". Kindly provide pricing, availability and lead times.\n\n"+"-".repeat(50)+"\n\n"+rows+"\n\n"+"-".repeat(50)+"\n\nKind regards,\n"+(project.company||"[Your Company]");
}

function FilteredItems(props) {
  var items=props.items, search=props.search, sortBy=props.sortBy, rooms=props.rooms;
  var sortCol=props.sortCol, sortDir=props.sortDir;
  var allItems=items;
  if(search&&search.trim()){
    var q=search.toLowerCase();
    allItems=allItems.filter(function(it){return (it.material||"").toLowerCase().includes(q)||(it.room||"").toLowerCase().includes(q)||(it.vendor||"").toLowerCase().includes(q)||(it.brand||"").toLowerCase().includes(q)||(it.description||"").toLowerCase().includes(q)||(it.component||"").toLowerCase().includes(q);});
  }
  if(sortBy&&sortBy!=="none"){
    allItems=[...allItems].sort(function(a,b){var av=(a[sortBy]||"").toLowerCase();var bv=(b[sortBy]||"").toLowerCase();return av<bv?-1:av>bv?1:0;});
  }
  if(sortCol){
    allItems=[...allItems].sort(function(a,b){
      var av=(a[sortCol]||"").toLowerCase();
      var bv=(b[sortCol]||"").toLowerCase();
      if(sortCol==="status"){
        var order=["Draft","Ready to Quote","Quoted","Ordered","Confirmed","Delivered","Lordes"];
        av=order.indexOf(a[sortCol]||"Draft");
        bv=order.indexOf(b[sortCol]||"Draft");
        return sortDir==="asc"?av-bv:bv-av;
      }
      if(sortDir==="asc")return av<bv?-1:av>bv?1:0;
      return av>bv?-1:av<bv?1:0;
    });
  }
  var isFiltered=(search&&search.trim())||(sortBy&&sortBy!=="none");
  var roomList=isFiltered?["Results ("+allItems.length+")"]:rooms;
  if(allItems.length===0&&search&&search.trim()){
    return <div style={{textAlign:"center",padding:"40px 20px",color:"#94a3b8",fontSize:14}}>No items match "{search}"</div>;
  }
  return (
    <div>
      {roomList.map(function(room){
        var roomItems=isFiltered?allItems:allItems.filter(function(it){return (it.room||"Unassigned")===room;});
        return <RoomTable key={room} room={room} items={roomItems} editId={props.editId} onEdit={props.onEdit} onUpdate={props.onUpdate} onDelete={props.onDelete} selectedItems={props.selectedItems} onToggleSelect={props.onToggleSelect} visibleCols={props.visibleCols} sortCol={sortCol} sortDir={sortDir} onSortCol={props.onSortCol}/>;
      })}
    </div>
  );
}

  const [loading,setLoading]=useState(true);
  const [saving,setSaving]=useState(false);
  const active=projects.find(function(p){return p.id===activeId;});

  useEffect(function(){
    (async function(){
      try{var res=await window.storage.list("proj:");if(res&&res.keys.length){var loaded=[];for(var i=0;i<res.keys.length;i++){try{var r=await window.storage.get(res.keys[i]);if(r)loaded.push(JSON.parse(r.value));}catch(e){}}loaded.sort(function(a,b){return new Date(b.updatedAt)-new Date(a.updatedAt);});setProjects(loaded);}}catch(e){}
      try{var v=await window.storage.get("global:vendors");if(v)setVendors(JSON.parse(v.value));}catch(e){}
      try{var k=await window.storage.get("global:apikey");if(k)setApiKey(k.value);}catch(e){}
      try{var vc=await window.storage.get("global:viscols");if(vc)setSavedCols(JSON.parse(vc.value));}catch(e){}
      try{var ul=await window.storage.get("global:users");if(ul){var parsed=JSON.parse(ul.value);if(parsed&&parsed.length)DEFAULT_USERS=parsed;}}catch(e){}
      setLoading(false);
      try{var params=new URLSearchParams(window.location.search);var pid=params.get("project");if(pid){setActiveId(pid);setScreen("project");}}catch(e){}
    })();
  },[]);

  const persist=async function(proj){setSaving(true);try{await window.storage.set("proj:"+proj.id,JSON.stringify(proj));}catch(e){}setSaving(false);};
  const persistVendors=async function(list){try{await window.storage.set("global:vendors",JSON.stringify(list));}catch(e){}};
  const saveApiKey=async function(key){setApiKey(key);try{await window.storage.set("global:apikey",key);}catch(e){}};
  const saveVisibleCols=async function(cols){setSavedCols(cols);try{await window.storage.set("global:viscols",JSON.stringify(cols));}catch(e){}};

  const updateActive=useCallback(function(fn){
    setProjects(function(prev){return prev.map(function(p){
      if(p.id!==activeId)return p;
      var next=Object.assign({},fn(p),{updatedAt:new Date().toISOString()});
      persist(next);return next;
    });});
  },[activeId]);

  if(loading)return <div style={{display:"flex",alignItems:"center",justifyContent:"center",height:"100vh",fontFamily:"system-ui",color:"#64748b",fontSize:14}}>Loading...</div>;
  if(!currentUser)return <LoginScreen users={DEFAULT_USERS} onLogin={function(user){setCurrentUser(user);}} onSaveUsers={async function(users){DEFAULT_USERS=users;try{await window.storage.set("global:users",JSON.stringify(users));}catch(e){}}} apiKey={apiKey}/>;
  if(screen==="vendors")return <VendorsScreen vendors={vendors} onBack={function(){setScreen("home");}} onChange={function(v){setVendors(v);persistVendors(v);}}/>;
  if(screen==="project"&&active)return <ProjectScreen active={active} vendors={vendors} saving={saving} apiKey={apiKey} savedCols={savedCols} onSaveVisibleCols={saveVisibleCols} currentUser={currentUser} onBack={function(){try{window.history.pushState({},"",window.location.pathname);}catch(e){}setScreen("home");}} updateActive={updateActive}/>;
  return <HomeScreen projects={projects} saving={saving} apiKey={apiKey} currentUser={currentUser} onLogout={function(){setCurrentUser(null);}} onSaveApiKey={saveApiKey} onVendors={function(){setScreen("vendors");}} onOpen={function(id){setActiveId(id);setScreen("project");try{window.history.pushState({},"",window.location.pathname+"?project="+id);}catch(e){}}} onCreateProject={function(name,company){var p=mkProject(name,company);setProjects(function(prev){return [p,...prev];});persist(p);setActiveId(p.id);setScreen("project");try{window.history.pushState({},"",window.location.pathname+"?project="+p.id);}catch(e){}}} onDeleteProject={async function(id){try{await window.storage.delete("proj:"+id);}catch(e){}setProjects(function(prev){return prev.filter(function(p){return p.id!==id;});});}}/>;
}
</script>
<script type="text/babel">
function LoginScreen(props) {
  const [pin,setPin]=useState("");
  const [error,setError]=useState("");
  const [showManage,setShowManage]=useState(false);
  const [adminMode,setAdminMode]=useState(false);
  const [adminPin,setAdminPin]=useState("");
  const [newName,setNewName]=useState("");
  const [newPin,setNewPin]=useState("");
  const [newAdminPin,setNewAdminPin]=useState("");
  const [newAdminPin2,setNewAdminPin2]=useState("");
  const [users,setUsers]=useState(props.users);

  var getAdmin=function(){return users.find(function(u){return u.name==="Admin";});};

  var tryLogin=function(){
    var user=users.find(function(u){return u.pin===pin;});
    if(user){setError("");props.onLogin(user);}
    else{setError("Incorrect PIN. Try again.");setPin("");}
  };

  var handleKey=function(e){if(e.key==="Enter")tryLogin();};

  var tryUnlock=function(){
    var admin=getAdmin();
    if(admin&&adminPin===admin.pin){setAdminMode(true);setError("");}
    else{setError("Wrong admin PIN.");}
  };

  var addUser=function(){
    if(!newName.trim()||newPin.length!==4)return;
    if(newName.trim()==="Admin"){setError("Cannot use name 'Admin'");return;}
    if(users.some(function(u){return u.pin===newPin;})){setError("PIN already in use");return;}
    var updated=[...users,{name:newName.trim(),pin:newPin}];
    // Make sure Admin is always first
    if(!updated.some(function(u){return u.name==="Admin";})){
      updated=[{name:"Admin",pin:getAdmin()?getAdmin().pin:"0000"}].concat(updated);
    }
    setUsers(updated);props.onSaveUsers(updated);
    setNewName("");setNewPin("");setError("");
  };

  var removeUser=function(p){
    var toRemove=users.find(function(u){return u.pin===p;});
    if(toRemove&&toRemove.name==="Admin"){alert("Cannot remove Admin user");return;}
    var updated=users.filter(function(u){return u.pin!==p;});
    // Always keep Admin in list
    if(!updated.some(function(u){return u.name==="Admin";})){
      updated=[{name:"Admin",pin:getAdmin()?getAdmin().pin:"0000"}].concat(updated);
    }
    setUsers(updated);props.onSaveUsers(updated);
  };

  var changeAdminPin=function(){
    if(newAdminPin.length!==4){setError("PIN must be 4 digits");return;}
    if(newAdminPin!==newAdminPin2){setError("PINs do not match");return;}
    // Make sure Admin always stays in the list, just update pin
    var hasAdmin=users.some(function(u){return u.name==="Admin";});
    var updated;
    if(hasAdmin){
      updated=users.map(function(u){return u.name==="Admin"?Object.assign({},u,{pin:newAdminPin}):u;});
    } else {
      // Admin was missing - add it back with new pin
      updated=[{name:"Admin",pin:newAdminPin}].concat(users);
    }
    setUsers(updated);props.onSaveUsers(updated);
    setNewAdminPin("");setNewAdminPin2("");setError("");
    alert("Admin PIN changed to "+newAdminPin+" - please remember it!");
  };

  var nonAdminUsers=users.filter(function(u){return u.name!=="Admin";});

  return (
    <div style={{minHeight:"100vh",background:"#f8fafc",display:"flex",alignItems:"center",justifyContent:"center",fontFamily:"system-ui,sans-serif"}}>
      <div style={{width:"100%",maxWidth:380,padding:"0 20px"}}>
        <div style={{textAlign:"center",marginBottom:32}}>
          <div style={{fontSize:28,fontWeight:700,color:"#0f172a",marginBottom:4}}>RenoMaterials</div>
          <div style={{fontSize:14,color:"#64748b"}}>Enter your PIN to continue</div>
        </div>
        {!showManage ? (
          <div style={{background:"#fff",borderRadius:12,padding:24,border:"1px solid #e2e8f0",boxShadow:"0 2px 8px rgba(0,0,0,0.06)"}}>
            <div style={{marginBottom:16}}>
              <label style={{fontSize:12,fontWeight:600,color:"#64748b",textTransform:"uppercase",letterSpacing:"0.5px",display:"block",marginBottom:6}}>4-Digit PIN</label>
              <input value={pin} onChange={function(e){setPin(e.target.value.replace(/[^0-9]/g,"").slice(0,4));setError("");}} onKeyDown={handleKey} type="password" inputMode="numeric" maxLength={4} placeholder="Enter PIN" autoFocus style={{display:"block",width:"100%",border:"1px solid #e2e8f0",borderRadius:8,padding:"12px 14px",fontSize:20,letterSpacing:8,outline:"none",boxSizing:"border-box",textAlign:"center"}}/>
            </div>
            {error&&<div style={{fontSize:13,color:"#ef4444",marginBottom:12,textAlign:"center"}}>{error}</div>}
            <button onClick={tryLogin} disabled={pin.length!==4} style={{width:"100%",background:pin.length===4?"#0f172a":"#e2e8f0",color:pin.length===4?"#fff":"#94a3b8",border:"none",borderRadius:8,padding:"12px",fontSize:14,fontWeight:600,cursor:pin.length===4?"pointer":"default"}}>Sign In</button>
            <button onClick={function(){setShowManage(true);setError("");}} style={{width:"100%",background:"none",border:"none",color:"#94a3b8",fontSize:12,cursor:"pointer",marginTop:12,padding:"4px"}}>Admin</button>
          </div>
        ) : (
          <div style={{background:"#fff",borderRadius:12,padding:24,border:"1px solid #e2e8f0",boxShadow:"0 2px 8px rgba(0,0,0,0.06)"}}>
            <div style={{fontSize:14,fontWeight:600,color:"#0f172a",marginBottom:12}}>Admin Panel</div>
            {!adminMode ? (
              <div>
                <label style={{fontSize:12,fontWeight:600,color:"#64748b",textTransform:"uppercase",letterSpacing:"0.5px",display:"block",marginBottom:6}}>Admin PIN</label>
                <div style={{display:"flex",gap:8,marginBottom:8}}>
                  <input value={adminPin} onChange={function(e){setAdminPin(e.target.value.replace(/[^0-9]/g,"").slice(0,4));setError("");}} onKeyDown={function(e){if(e.key==="Enter")tryUnlock();}} type="password" inputMode="numeric" maxLength={4} placeholder="Enter admin PIN" autoFocus style={{flex:1,border:"1px solid #e2e8f0",borderRadius:6,padding:"8px 10px",fontSize:16,outline:"none",textAlign:"center",letterSpacing:6}}/>
                  <button onClick={tryUnlock} disabled={adminPin.length!==4} style={{background:"#0f172a",color:"#fff",border:"none",borderRadius:6,padding:"8px 16px",fontSize:13,cursor:adminPin.length===4?"pointer":"default"}}>Unlock</button>
                </div>
                {error&&<div style={{fontSize:12,color:"#ef4444",marginBottom:8}}>{error}</div>}
              </div>
            ) : (
              <div>
                <div style={{fontSize:12,fontWeight:600,color:"#0f172a",marginBottom:8}}>Users</div>
                <div style={{marginBottom:14}}>
                  {nonAdminUsers.length===0&&<div style={{fontSize:12,color:"#94a3b8",padding:"8px 0"}}>No users yet. Add one below.</div>}
                  {nonAdminUsers.map(function(u){return (
                    <div key={u.pin} style={{display:"flex",alignItems:"center",gap:8,padding:"7px 0",borderBottom:"1px solid #f1f5f9"}}>
                      <span style={{flex:1,fontSize:13,fontWeight:500,color:"#0f172a"}}>{u.name}</span>
                      <span style={{fontSize:11,color:"#94a3b8",fontFamily:"monospace"}}>PIN: ****</span>
                      <button onClick={function(){removeUser(u.pin);}} style={{background:"none",border:"none",color:"#ef4444",cursor:"pointer",fontSize:12,padding:"0 4px"}}>Remove</button>
                    </div>
                  );})}
                </div>
                <div style={{fontSize:12,fontWeight:600,color:"#0f172a",marginBottom:8}}>Add New User</div>
                <div style={{display:"grid",gridTemplateColumns:"1fr 90px",gap:8,marginBottom:8}}>
                  <input value={newName} onChange={function(e){setNewName(e.target.value);}} placeholder="Name" style={{border:"1px solid #e2e8f0",borderRadius:6,padding:"7px 10px",fontSize:13,outline:"none"}}/>
                  <input value={newPin} onChange={function(e){setNewPin(e.target.value.replace(/[^0-9]/g,"").slice(0,4));}} type="password" inputMode="numeric" maxLength={4} placeholder="PIN" style={{border:"1px solid #e2e8f0",borderRadius:6,padding:"7px 10px",fontSize:13,outline:"none",textAlign:"center",letterSpacing:4}}/>
                </div>
                {error&&<div style={{fontSize:12,color:"#ef4444",marginBottom:8}}>{error}</div>}
                <button onClick={addUser} disabled={!newName.trim()||newPin.length!==4} style={{width:"100%",background:"#0f172a",color:"#fff",border:"none",borderRadius:6,padding:"8px",fontSize:13,cursor:(!newName.trim()||newPin.length!==4)?"default":"pointer",marginBottom:14}}>Add User</button>
                <div style={{borderTop:"1px solid #f1f5f9",paddingTop:14}}>
                  <div style={{fontSize:12,fontWeight:600,color:"#0f172a",marginBottom:8}}>Change Admin PIN</div>
                  <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:8}}>
                    <input value={newAdminPin} onChange={function(e){setNewAdminPin(e.target.value.replace(/[^0-9]/g,"").slice(0,4));setError("");}} type="password" inputMode="numeric" maxLength={4} placeholder="New PIN" style={{border:"1px solid #e2e8f0",borderRadius:6,padding:"7px 10px",fontSize:13,outline:"none",textAlign:"center",letterSpacing:4}}/>
                    <input value={newAdminPin2} onChange={function(e){setNewAdminPin2(e.target.value.replace(/[^0-9]/g,"").slice(0,4));setError("");}} type="password" inputMode="numeric" maxLength={4} placeholder="Confirm" style={{border:"1px solid #e2e8f0",borderRadius:6,padding:"7px 10px",fontSize:13,outline:"none",textAlign:"center",letterSpacing:4}}/>
                  </div>
                  <button onClick={changeAdminPin} disabled={newAdminPin.length!==4||newAdminPin2.length!==4} style={{width:"100%",background:"#f1f5f9",color:"#64748b",border:"none",borderRadius:6,padding:"8px",fontSize:13,cursor:"pointer",marginBottom:4}}>Save New Admin PIN</button>
                </div>
              </div>
            )}
            <button onClick={function(){setShowManage(false);setAdminMode(false);setAdminPin("");setError("");setNewAdminPin("");setNewAdminPin2("");}} style={{width:"100%",background:"none",border:"1px solid #e2e8f0",borderRadius:6,padding:"8px",fontSize:13,color:"#64748b",cursor:"pointer",marginTop:8}}>Back to Login</button>
          </div>
        )}
      </div>
    </div>
  );
}


function HomeScreen(props) {
  const [name,setName]=useState("");
  const [company,setCompany]=useState("");
  const [showForm,setShowForm]=useState(false);
  const [showSettings,setShowSettings]=useState(false);
  const [keyInput,setKeyInput]=useState("");

  return (
    <div style={{fontFamily:"system-ui,sans-serif",background:"#f8fafc",minHeight:"100vh"}}>
      <div style={{background:"#fff",borderBottom:"1px solid #e2e8f0",padding:"0 24px",display:"flex",alignItems:"center",height:56,gap:12}}>
        <span style={{fontWeight:700,fontSize:16,color:"#0f172a"}}>RenoMaterials</span>
        {props.saving&&<span style={{fontSize:12,color:"#94a3b8"}}>Saving...</span>}
        <div style={{marginLeft:"auto",display:"flex",gap:8,alignItems:"center"}}>
          {props.currentUser&&<span style={{fontSize:12,color:"#64748b",fontWeight:500}}>{props.currentUser.name}</span>}
          <Btn ghost small onClick={function(){setShowSettings(function(v){return !v;});}} label="Settings"/>
          <Btn ghost small onClick={props.onVendors} label="Vendors"/>
          <Btn small onClick={function(){setShowForm(true);}} label="+ New Project"/>
          <button onClick={props.onLogout} style={{background:"none",border:"1px solid #e2e8f0",borderRadius:6,padding:"4px 10px",cursor:"pointer",fontSize:12,color:"#64748b"}}>Sign Out</button>
        </div>
      </div>
      <div style={{maxWidth:760,margin:"0 auto",padding:"24px"}}>
        {showSettings&&(
          <div style={{background:"#fff",border:"1px solid #e2e8f0",borderRadius:10,padding:20,marginBottom:16}}>
            <div style={{fontSize:14,fontWeight:600,marginBottom:4,color:"#0f172a"}}>Settings</div>
            <div style={{fontSize:12,color:"#64748b",marginBottom:12}}>Enter your Anthropic API key to enable PDF import. Get one free at console.anthropic.com</div>
            <div style={{display:"flex",gap:8,alignItems:"flex-end"}}>
              <div style={{flex:1}}><label style={lbl}>Anthropic API Key</label><input value={keyInput} onChange={function(e){setKeyInput(e.target.value);}} type="password" placeholder="sk-ant-..." style={inp}/></div>
              <Btn onClick={function(){props.onSaveApiKey(keyInput);setShowSettings(false);}} label="Save" disabled={!keyInput.trim()}/>
              <Btn ghost onClick={function(){setShowSettings(false);}} label="Cancel"/>
            </div>
            {props.apiKey&&<div style={{fontSize:12,color:"#22c55e",marginTop:8}}>API key saved - PDF import enabled</div>}
          </div>
        )}
        {showForm&&(
          <div style={{background:"#fff",border:"1px solid #e2e8f0",borderRadius:10,padding:20,marginBottom:16}}>
            <div style={{fontSize:14,fontWeight:600,marginBottom:12,color:"#0f172a"}}>New Project</div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:12}}>
              <div><label style={lbl}>Project Name *</label><input value={name} onChange={function(e){setName(e.target.value);}} placeholder="Project name" style={inp}/></div>
              <div><label style={lbl}>Company</label><input value={company} onChange={function(e){setCompany(e.target.value);}} placeholder="Company name" style={inp}/></div>
            </div>
            <div style={{display:"flex",gap:8}}>
              <Btn onClick={function(){if(!name.trim())return;props.onCreateProject(name.trim(),company.trim());setName("");setCompany("");setShowForm(false);}} label="Create Project" disabled={!name.trim()}/>
              <Btn ghost onClick={function(){setShowForm(false);}} label="Cancel"/>
            </div>
          </div>
        )}
        <div style={{fontSize:11,fontWeight:600,color:"#94a3b8",letterSpacing:1,textTransform:"uppercase",marginBottom:8}}>Projects ({props.projects.length})</div>
        {props.projects.length===0&&<div style={{textAlign:"center",padding:"48px 0",color:"#cbd5e1",fontSize:14}}>No projects yet. Create your first one above.</div>}
        <div style={{display:"flex",flexDirection:"column",gap:6}}>
          {props.projects.map(function(p){
            var rooms=[...new Set(p.items.map(function(it){return it.room;}).filter(Boolean))];
            return (
              <div key={p.id} onClick={function(){props.onOpen(p.id);}} style={{background:"#fff",border:"1px solid #e2e8f0",borderRadius:8,padding:"14px 16px",display:"flex",alignItems:"center",gap:12,cursor:"pointer"}}>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontWeight:600,fontSize:14,color:"#0f172a",marginBottom:2}}>{p.name}</div>
                  <div style={{fontSize:12,color:"#94a3b8"}}>{p.items.length} items{rooms.length?" - "+rooms.slice(0,3).join(", ")+(rooms.length>3?" +more":""):""} - {new Date(p.updatedAt).toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"})}</div>
                  {p.notes&&<div style={{fontSize:12,color:"#94a3b8",marginTop:2,overflow:"hidden",whiteSpace:"nowrap",textOverflow:"ellipsis"}}>{p.notes}</div>}
                  {p.folderUrl&&<div style={{fontSize:12,color:"#3b82f6",marginTop:2}}>Folder linked</div>}
                </div>
                <button onClick={function(e){e.stopPropagation();props.onDeleteProject(p.id);}} style={{background:"none",border:"none",color:"#cbd5e1",cursor:"pointer",fontSize:14,padding:"2px 6px"}}>x</button>
                <span style={{color:"#cbd5e1",fontSize:18}}>{">"}</span>
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
}

function VendorsScreen(props) {

    <div style={{fontFamily:"system-ui,sans-serif",background:"#f8fafc",minHeight:"100vh"}}>

        <span style={{fontWeight:600,fontSize:15,color:"#0f172a"}}>Vendor Directory</span>

          <div style={{background:"#fff",border:"1px solid #e2e8f0",borderRadius:10,padding:16,marginBottom:16}}>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:10}}>
              <div><label style={lbl}>Name *</label><input value={form.name} onChange={function(e){setForm(function(p){return Object.assign({},p,{name:e.target.value});});}} placeholder="Name" style={inp}/></div>
              <div><label style={lbl}>Email *</label><input value={form.email} onChange={function(e){setForm(function(p){return Object.assign({},p,{email:e.target.value});});}} type="email" placeholder="Email" style={inp}/></div>
              <div><label style={lbl}>Phone</label><input value={form.phone} onChange={function(e){setForm(function(p){return Object.assign({},p,{phone:e.target.value});});}} placeholder="Phone" style={inp}/></div>

          </div>
        )}
        {props.vendors.length===0&&!showForm&&<div style={{textAlign:"center",padding:"40px 0",color:"#cbd5e1",fontSize:14}}>No vendors saved yet.</div>}
        {props.vendors.map(function(v){return (
          <div key={v.id} style={{background:"#fff",border:"1px solid #e2e8f0",borderRadius:8,padding:"12px 14px",display:"flex",alignItems:"center",gap:10,marginBottom:6}}>
            <div style={{flex:1}}>
              <div style={{fontWeight:600,fontSize:14,color:"#0f172a"}}>{v.name}</div>
              <div style={{fontSize:12,color:"#94a3b8"}}>{v.email}{v.phone?" - "+v.phone:""}</div>
            </div>
            <span style={{fontSize:11,background:v.type==="vendor"?"#fef3e2":"#eff6ff",color:v.type==="vendor"?"#b45309":"#2563eb",borderRadius:20,padding:"2px 8px"}}>{v.type}</span>
            <button onClick={function(){props.onChange(props.vendors.filter(function(x){return x.id!==v.id;}));}} style={{background:"none",border:"none",color:"#cbd5e1",cursor:"pointer",fontSize:14}}>x</button>
          </div>
        );})}
      </div>

</script>
<script type="text/babel">
function ProjectScreen(props) {

  const [tab,setTab]=useState("items");
  const [editId,setEditId]=useState(null);
  const [importState,setImportState]=useState(null);
  const [importing,setImporting]=useState(false);
  const [parsingPdf,setParsingPdf]=useState(false);
  const [selectedItems,setSelectedItems]=useState([]);
  const [selectedContacts,setSelectedContacts]=useState([]);
  const [emailCopied,setEmailCopied]=useState(false);
  const [quoteMarked,setQuoteMarked]=useState(false);
  const [showContactForm,setShowContactForm]=useState(false);
  const [showVendorPicker,setShowVendorPicker]=useState(false);
  const [contactForm,setContactForm]=useState({name:"",email:"",type:"vendor"});
  const [showNotes,setShowNotes]=useState(false);
  const [search,setSearch]=useState("");
  const [sortBy,setSortBy]=useState("none");
  const [showShareMsg,setShowShareMsg]=useState(false);
  const [showColPicker,setShowColPicker]=useState(false);
  const [visibleCols,setVisibleCols]=useState(props.savedCols||["component","material","vendor","brand","width","height","depth","qty","leadTime","status"]);
  const [sortCol,setSortCol]=useState(null);
  const [sortDir,setSortDir]=useState("asc");
  const fileRef=useRef();
  const pdfRef=useRef();

  const COL_DEFS=[
    {id:"component",label:"Component",w:"120px"},{id:"material",label:"Item Description",w:"1fr"},
    {id:"description",label:"Client Desc",w:"120px"},{id:"vendor",label:"Vendor",w:"90px"},
    {id:"brand",label:"Brand",w:"70px"},{id:"color",label:"Color",w:"70px"},
    {id:"finish",label:"Finish",w:"70px"},{id:"width",label:"W",w:"50px"},
    {id:"height",label:"H",w:"50px"},{id:"depth",label:"D",w:"50px"},
    {id:"qty",label:"Qty",w:"70px"},{id:"leadTime",label:"Lead Time",w:"80px"},
    {id:"status",label:"Status",w:"80px"},
  ];

  const addItem=function(){var item=mkItem();updateActive(function(p){return Object.assign({},p,{items:[...p.items,item]});});setEditId(item.id);setTab("items");};
  const updateItem=function(id,patch){
    var ts=new Date().toISOString();
    var by=props.currentUser?props.currentUser.name:"Unknown";
    updateActive(function(p){return Object.assign({},p,{items:p.items.map(function(it){
      if(it.id!==id)return it;
      var merged=Object.assign({},it,patch,{updatedAt:ts,updatedBy:by});
      if("qty" in patch && patch.qty && String(patch.qty).trim() && (it.status==="Draft")){
        merged.status="Ready to Quote";
      }
      return merged;
    })});});
  };
  const deleteItem=function(id){updateActive(function(p){return Object.assign({},p,{items:p.items.filter(function(it){return it.id!==id;})});});if(editId===id)setEditId(null);};

  const handleFile=async function(e){
    var file=e.target.files&&e.target.files[0];if(!file)return;
    setImporting(true);
    try{var res=await parseExcel(file);setImportState(Object.assign({},res,{fileName:file.name}));}catch(err){setImportState({items:[],warnings:["Error: "+err.message],fileName:file.name});}
    setImporting(false);e.target.value="";
  };

  const handlePdf=async function(e){
    var file=e.target.files&&e.target.files[0];if(!file)return;
    if(!apiKey){alert("Please add your Anthropic API key in Settings first.");return;}
    setParsingPdf(true);
    try{
      var base64=await new Promise(function(res,rej){var r=new FileReader();r.onload=function(ev){res(ev.target.result.split(",")[1]);};r.onerror=rej;r.readAsDataURL(file);});
      var response=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json","x-api-key":apiKey,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:16000,messages:[{role:"user",content:[{type:"document",source:{type:"base64",media_type:"application/pdf",data:base64}},{type:"text",text:"Extract all rows from this FF&E or materials schedule table. For each row output one line in this exact format (skip header rows and empty rows):\nCOMPONENT|ROOM|ITEM_DESCRIPTION|VENDOR|CLIENT_DESCRIPTION\n\nOutput ONLY the pipe-separated lines, nothing else."}]}]})});
      var data=await response.json();
      if(data.error)throw new Error(data.error.message);
      var rawText=data.content&&data.content.map(function(c){return c.text||"";}).join("").trim();
      if(!rawText)throw new Error("No text extracted from PDF");
      var lines=rawText.split("\n").filter(function(l){return l.includes("|");});
      if(!lines.length)throw new Error("No table rows found in PDF");
      var items=lines.map(function(line,i){
        var parts=line.split("|").map(function(p){return p.trim();});
        return Object.assign(mkItem(),{id:"pdf-"+Date.now()+"-"+i,component:parts[0]||"",room:parts[1]||"",material:parts[2]||"",vendor:parts[3]||"",description:parts[4]||""});
      }).filter(function(it){return it.material||it.component;});
      setImportState({items:items,warnings:[],fileName:file.name});
    }catch(err){alert("PDF parsing failed: "+err.message);}
    setParsingPdf(false);e.target.value="";
  };

  const applyImport=function(){if(!importState||!importState.items.length)return;updateActive(function(p){return Object.assign({},p,{items:[...p.items,...importState.items]});});setImportState(null);};
  const addContact=function(){if(!contactForm.name.trim()||!contactForm.email.trim())return;var c=Object.assign({},contactForm,{id:"c-"+Date.now()});updateActive(function(p){return Object.assign({},p,{contacts:[...p.contacts,c]});});setShowContactForm(false);setContactForm({name:"",email:"",type:"vendor"});};
  const emailText=active?buildEmail(active,selectedContacts,selectedItems):"";
  const rooms=[...new Set(active.items.map(function(it){return it.room||"Unassigned";}))];
  const activeCols=COL_DEFS.filter(function(c){return visibleCols.includes(c.id);});
  const cols="32px 36px "+activeCols.map(function(c){return c.w;}).join(" ");

  return (
    <div style={{fontFamily:"system-ui,sans-serif",background:"#f8fafc",minHeight:"100vh"}}>
      <div style={{background:"#fff",borderBottom:"1px solid #e2e8f0",padding:"0 20px",display:"flex",alignItems:"center",height:52,gap:10,position:"sticky",top:0,zIndex:10}}>
        <button onClick={props.onBack} style={{background:"none",border:"1px solid #e2e8f0",borderRadius:6,padding:"4px 10px",cursor:"pointer",fontSize:12,color:"#64748b"}}>Back</button>
        <span style={{fontWeight:700,fontSize:14,color:"#0f172a",flex:1,overflow:"hidden",whiteSpace:"nowrap",textOverflow:"ellipsis"}}>{active.name}</span>
        {saving&&<span style={{fontSize:11,color:"#94a3b8"}}>Saving...</span>}
        <button onClick={function(){exportToExcel(active);}} style={Object.assign({},bsty,{background:"#f1f5f9",color:"#64748b",fontSize:12})}>Export XLS</button>
        <button onClick={function(){setShowNotes(function(v){return !v;});}} style={Object.assign({},bsty,{background:showNotes?"#0f172a":"#f1f5f9",color:showNotes?"#fff":"#64748b",fontSize:12})}>{showNotes?"Hide Notes":"Notes"}</button>
      </div>
      <div style={{background:"#fff",borderBottom:"1px solid #e2e8f0",padding:"0 20px",display:"flex",alignItems:"center",gap:0,overflowX:"auto"}}>
        {["items","financial","email","contacts"].map(function(tabId){return (
          <button key={tabId} onClick={function(){setTab(tabId);if(tabId==="email")setSelectedItems(active.items.filter(function(it){return it.status==="Draft"||it.status==="Ready to Quote";}).map(function(it){return it.id;}));}} style={{padding:"10px 14px",border:"none",borderBottom:tab===tabId?"2px solid #0f172a":"2px solid transparent",background:"none",cursor:"pointer",fontSize:13,fontWeight:tab===tabId?600:400,color:tab===tabId?"#0f172a":"#64748b",whiteSpace:"nowrap"}}>
            {tabId==="items"?"Items ("+active.items.length+")":tabId==="financial"?"Financial":tabId==="email"?"Quote Email":"Contacts ("+active.contacts.length+")"}
          </button>
        );})}
        <div style={{marginLeft:"auto",paddingLeft:8,flexShrink:0}}>
          <select onChange={function(e){if(e.target.value){var el=document.getElementById("room-"+e.target.value);if(el)el.scrollIntoView({behavior:"smooth",block:"start"});}e.target.value="";}} style={{fontSize:12,padding:"4px 8px",border:"1px solid #e2e8f0",borderRadius:6,background:"#fff",color:"#64748b",cursor:"pointer"}}>
            <option value="">View Section</option>
            {rooms.map(function(r){return <option key={r} value={r}>{r} ({active.items.filter(function(it){return (it.room||"Unassigned")===r;}).length})</option>;})}
          </select>
        </div>
      </div>
      {showNotes&&(
        <div style={{background:"#fffbeb",borderBottom:"1px solid #fde68a",padding:"12px 16px"}}>
          <div style={{maxWidth:1100,margin:"0 auto"}}>
            <div style={{fontSize:11,fontWeight:600,color:"#92400e",textTransform:"uppercase",letterSpacing:"0.5px",marginBottom:6}}>Project Notes</div>
            <textarea value={active.notes||""} onChange={function(e){updateActive(function(p){return Object.assign({},p,{notes:e.target.value});});}} placeholder="Project description, scope, contacts, site notes..." style={{width:"100%",border:"1px solid #fde68a",borderRadius:6,padding:"8px 10px",fontSize:13,color:"#0f172a",background:"#fff",resize:"vertical",minHeight:60,outline:"none",boxSizing:"border-box",fontFamily:"system-ui,sans-serif",marginBottom:10}}/>
            <div style={{fontSize:11,fontWeight:600,color:"#92400e",textTransform:"uppercase",letterSpacing:"0.5px",marginBottom:4}}>Files / Documents Folder</div>
            <div style={{display:"flex",alignItems:"center",gap:8}}>
              <div style={{flex:1,minWidth:0}}>
                <FolderInput value={active.folderUrl||""} onSave={function(url){updateActive(function(p){return Object.assign({},p,{folderUrl:url});});}}/>
              </div>
              {active.folderUrl&&(
                <a href={active.folderUrl.startsWith("http")?active.folderUrl:"https://"+active.folderUrl} target="_blank" rel="noreferrer" style={{flexShrink:0,padding:"7px 12px",background:"#92400e",color:"#fff",borderRadius:6,fontSize:12,fontWeight:500,textDecoration:"none",whiteSpace:"nowrap"}}>Open</a>
              )}
            </div>
          </div>
        </div>
      )}
      <div style={{maxWidth:1100,margin:"0 auto",padding:"0 16px 60px"}}>
        {tab==="items"&&(
          <div>
            <StatusSummary items={active.items}/>
            <RecentChanges items={active.items}/>
            <div style={{display:"flex",alignItems:"center",gap:8,padding:"10px 0 6px",flexWrap:"wrap"}}>
              <input value={search} onChange={function(e){setSearch(e.target.value);}} placeholder="Search items..." style={{flex:1,minWidth:140,border:"1px solid #e2e8f0",borderRadius:6,padding:"6px 10px",fontSize:13,outline:"none",background:"#fff"}}/>
              <select value={sortBy} onChange={function(e){setSortBy(e.target.value);}} style={{border:"1px solid #e2e8f0",borderRadius:6,padding:"6px 8px",fontSize:12,color:"#64748b",background:"#fff",outline:"none"}}>
                <option value="none">Sort: Default</option>
                <option value="status">Sort: Status</option>
                <option value="room">Sort: Room</option>
                <option value="vendor">Sort: Vendor</option>
                <option value="material">Sort: Name</option>
              </select>
              <button onClick={function(){copyText(window.location.href);setShowShareMsg(true);setTimeout(function(){setShowShareMsg(false);},2500);}} style={Object.assign({},bsty,{background:showShareMsg?"#22c55e":"#f1f5f9",color:showShareMsg?"#fff":"#64748b",fontSize:12,whiteSpace:"nowrap"})}>{showShareMsg?"Copied!":"Copy Link"}</button>
            </div>
            <div style={{display:"flex",alignItems:"center",gap:8,padding:"0 0 10px",flexWrap:"wrap"}}>
              <Btn small onClick={addItem} label="+ Add Item"/>
              <input ref={fileRef} type="file" accept=".xlsx,.xls,.csv" style={{display:"none"}} onChange={handleFile}/>
              <Btn small ghost onClick={function(){fileRef.current&&fileRef.current.click();}} label={importing?"Reading...":"Import Excel"}/>
              <input ref={pdfRef} type="file" accept="application/pdf" style={{display:"none"}} onChange={handlePdf}/>
              <Btn small ghost onClick={function(){pdfRef.current&&pdfRef.current.click();}} label={parsingPdf?"Reading PDF...":"Import PDF"}/>
              <Btn small ghost onClick={function(){setShowColPicker(function(v){return !v;});}} label="Columns"/>
              {!apiKey&&<span style={{fontSize:11,color:"#f59e0b"}}>Add API key in Settings to enable PDF import</span>}
            </div>
            {showColPicker&&(
              <div style={{background:"#fff",border:"1px solid #e2e8f0",borderRadius:8,padding:"12px 14px",marginBottom:10}}>
                <div style={{fontSize:12,fontWeight:600,color:"#0f172a",marginBottom:8}}>Toggle visible columns</div>
                <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
                  {COL_DEFS.map(function(col){
                    var on=visibleCols.includes(col.id);
                    return <button key={col.id} onClick={function(){var next=on?visibleCols.filter(function(c){return c!==col.id;}):[...visibleCols,col.id];setVisibleCols(next);props.onSaveVisibleCols(next);}} style={{fontSize:12,borderRadius:20,padding:"3px 10px",border:on?"none":"0.5px solid #e2e8f0",background:on?"#0f172a":"#f8fafc",color:on?"#fff":"#64748b",cursor:"pointer"}}>{col.label}</button>;
                  })}
                </div>
              </div>
            )}
            {importState&&(
              <div style={{background:"#f0fdf4",border:"1px solid #bbf7d0",borderRadius:8,padding:12,marginBottom:12}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}>
                  <span style={{fontSize:13,fontWeight:600,color:"#166534"}}>{importState.fileName} - {importState.items.length} items found</span>
                  <button onClick={function(){setImportState(null);}} style={{background:"none",border:"none",color:"#94a3b8",cursor:"pointer",fontSize:16}}>x</button>
                </div>
                {importState.warnings&&importState.warnings.map(function(w,i){return <div key={i} style={{fontSize:12,color:"#d97706"}}>Warning: {w}</div>;})}
                <div style={{maxHeight:120,overflowY:"auto",margin:"8px 0"}}>
                  {importState.items.slice(0,5).map(function(it,i){return <div key={i} style={{fontSize:12,color:"#374151",padding:"2px 0"}}>{it.material}{it.room?" - "+it.room:""}</div>;})}
                  {importState.items.length>5&&<div style={{fontSize:12,color:"#94a3b8"}}>+{importState.items.length-5} more...</div>}
                </div>
                <div style={{display:"flex",gap:8}}>
                  <Btn small onClick={applyImport} label={"Add "+importState.items.length+" items"}/>
                  <Btn small ghost onClick={function(){setImportState(null);}} label="Discard"/>
                </div>
              </div>
            )}
            {active.items.length===0&&(
              <div style={{textAlign:"center",padding:"60px 20px",color:"#cbd5e1"}}>
                <div style={{fontSize:32,marginBottom:8}}>[ ]</div>
                <div style={{fontSize:14}}>No items yet. Import from Excel/PDF or add manually.</div>
              </div>
            )}
            <FilteredItems items={active.items} search={search} sortBy={sortBy} rooms={rooms} sortCol={sortCol} sortDir={sortDir} editId={editId} onEdit={setEditId} onUpdate={updateItem} onDelete={deleteItem} selectedItems={selectedItems} onToggleSelect={function(id){setSelectedItems(function(s){return s.includes(id)?s.filter(function(x){return x!==id;}):[...s,id];});}} visibleCols={visibleCols} onSortCol={function(col){if(sortCol===col){setSortDir(function(d){return d==="asc"?"desc":"asc";});}else{setSortCol(col);setSortDir("asc");}}}/>
          </div>
        )}
        {tab==="financial"&&<FinancialTab items={active.items}/>}
        {tab==="email"&&(
          <div style={{paddingTop:16}}>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:12}}>
              <div style={{background:"#fff",border:"1px solid #e2e8f0",borderRadius:8,padding:14}}>
                <div style={{fontSize:13,fontWeight:600,color:"#0f172a",marginBottom:10}}>Recipients</div>
                {active.contacts.length===0&&<div style={{fontSize:13,color:"#94a3b8"}}>No contacts yet.</div>}
                {active.contacts.map(function(c){return (
                  <label key={c.id} style={{display:"flex",alignItems:"center",gap:8,padding:"6px 0",cursor:"pointer",borderBottom:"1px solid #f1f5f9"}}>
                    <input type="checkbox" checked={selectedContacts.includes(c.id)} onChange={function(){setSelectedContacts(function(s){return s.includes(c.id)?s.filter(function(x){return x!==c.id;}):[...s,c.id];});}} style={{accentColor:"#0f172a"}}/>
                    <div style={{flex:1}}>
                      <div style={{fontSize:13,fontWeight:500,color:"#0f172a"}}>{c.name}</div>
                      <div style={{fontSize:11,color:"#94a3b8"}}>{c.email}</div>
                    </div>
                  </label>
                );})}
              </div>
              <div style={{background:"#fff",border:"1px solid #e2e8f0",borderRadius:8,padding:14}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
                  <span style={{fontSize:13,fontWeight:600,color:"#0f172a"}}>Items ({selectedItems.length} selected)</span>
                  <button onClick={function(){
                    var draftIds=active.items.filter(function(it){return it.status==="Draft"||it.status==="Ready to Quote";}).map(function(it){return it.id;});
                    if(selectedItems.length===draftIds.length&&draftIds.every(function(id){return selectedItems.includes(id);})){
                      setSelectedItems([]);
                    } else {
                      setSelectedItems(draftIds);
                    }
                  }} style={{fontSize:12,color:"#64748b",background:"none",border:"none",cursor:"pointer"}}>{selectedItems.length>0&&selectedItems.length===active.items.filter(function(it){return it.status==="Draft"||it.status==="Ready to Quote";}).length?"Deselect all":"Select all"}</button>
                </div>
                <div style={{maxHeight:200,overflowY:"auto"}}>
                  {active.items.filter(function(it){return it.status==="Draft"||it.status==="Ready to Quote"||selectedItems.includes(it.id);}).map(function(it){
                    var checked=selectedItems.includes(it.id);
                    return (
                      <label key={it.id} style={{display:"flex",alignItems:"center",gap:8,padding:"5px 0",cursor:"pointer",borderBottom:"1px solid #f1f5f9"}}>
                        <input type="checkbox" checked={checked} onChange={function(){setSelectedItems(function(s){return s.includes(it.id)?s.filter(function(x){return x!==it.id;}):[...s,it.id];});}} style={{accentColor:"#0f172a"}}/>
                        <div style={{flex:1,minWidth:0}}>
                          <div style={{fontSize:12,fontWeight:500,color:"#0f172a",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{it.material||"(no name)"}</div>
                          {it.room&&<div style={{fontSize:11,color:"#94a3b8"}}>{it.room}</div>}
                        </div>
                      </label>
                    );
                  })}
                </div>
              </div>
            </div>
            <div style={{background:"#fff",border:"1px solid #e2e8f0",borderRadius:8,padding:14}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
                <span style={{fontSize:13,fontWeight:600,color:"#0f172a"}}>Email Preview</span>
                <div style={{display:"flex",gap:8}}>
                  <button onClick={function(){var r=active.contacts.filter(function(c){return selectedContacts.includes(c.id);});var to=r.map(function(c){return c.email;}).join(";");window.location.href="mailto:"+to+"?subject="+encodeURIComponent("Quote Request - "+active.name)+"&body="+encodeURIComponent(emailText);}} style={Object.assign({},bsty,{background:"#0f172a",color:"#fff"})}>Open in Outlook</button>
                  <button onClick={function(){copyText(emailText);setEmailCopied(true);setTimeout(function(){setEmailCopied(false);},2000);}} style={Object.assign({},bsty,{background:emailCopied?"#22c55e":"#f1f5f9",color:emailCopied?"#fff":"#0f172a"})}>{emailCopied?"Copied!":"Copy"}</button>
                  <button onClick={function(){
                    var ids=selectedItems.length?selectedItems:active.items.map(function(it){return it.id;});
                    var ts=new Date().toISOString();
                    var by=props.currentUser?props.currentUser.name:"Unknown";
                    ids.forEach(function(id){
                      var it=active.items.find(function(x){return x.id===id;});
                      if(it&&it.status==="Draft"){
                        updateItem(id,{status:"Quoted",updatedAt:ts,updatedBy:by});
                      }
                    });
                    setQuoteMarked(true);
                    setTimeout(function(){setQuoteMarked(false);},2500);
                  }} style={Object.assign({},bsty,{background:quoteMarked?"#b45309":"#fef3e2",color:quoteMarked?"#fff":"#b45309",border:"1px solid #fde68a",whiteSpace:"nowrap"})}>{quoteMarked?"Marked!":"Mark as Quoted"}</button>
                </div>
              </div>
              <pre style={{fontFamily:"monospace",fontSize:12,lineHeight:1.6,color:"#374151",whiteSpace:"pre-wrap",wordBreak:"break-word",background:"#f8fafc",borderRadius:6,padding:12,border:"1px solid #e2e8f0",maxHeight:320,overflowY:"auto",margin:0}}>{emailText||"Select recipients and items above to preview."}</pre>
            </div>
          </div>
        )}
        {tab==="contacts"&&(
          <div style={{paddingTop:16}}>
            <div style={{display:"flex",gap:8,marginBottom:12}}>
              {vendors.length>0&&<Btn small ghost onClick={function(){setShowVendorPicker(function(v){return !v;});}} label="Add from Directory"/>}
              <Btn small ghost onClick={function(){setShowContactForm(function(v){return !v;});}} label={showContactForm?"Cancel":"+ New Contact"}/>
            </div>
            {showVendorPicker&&(
              <div style={{background:"#fffbeb",border:"1px solid #fde68a",borderRadius:8,padding:12,marginBottom:12}}>
                <div style={{fontSize:13,fontWeight:600,color:"#92400e",marginBottom:8}}>Add from Vendor Directory</div>
                {vendors.map(function(v){var already=active.contacts.some(function(c){return c.email===v.email;});return(
                  <div key={v.id} style={{display:"flex",alignItems:"center",gap:10,padding:"6px 0",borderBottom:"1px solid #fde68a"}}>
                    <div style={{flex:1}}><span style={{fontSize:13,fontWeight:500}}>{v.name}</span><span style={{fontSize:12,color:"#94a3b8",marginLeft:8}}>{v.email}</span></div>
                    <button onClick={function(){if(!already){var c=Object.assign({},v,{id:"c-"+Date.now()});updateActive(function(p){return Object.assign({},p,{contacts:[...p.contacts,c]});});};}} disabled={already} style={Object.assign({},bsty,{background:already?"#f1f5f9":"#0f172a",color:already?"#94a3b8":"#fff",cursor:already?"default":"pointer"})}>{already?"Added":"Add"}</button>
                  </div>
                );})}
                <button onClick={function(){setShowVendorPicker(false);}} style={Object.assign({},bsty,{marginTop:8,background:"#f1f5f9",color:"#64748b"})}>Done</button>
              </div>
            )}
            {showContactForm&&(
              <div style={{background:"#fff",border:"1px solid #e2e8f0",borderRadius:8,padding:14,marginBottom:12}}>
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:10}}>
                  <div><label style={lbl}>Name *</label><input value={contactForm.name} onChange={function(e){setContactForm(function(p){return Object.assign({},p,{name:e.target.value});});}} placeholder="Name" style={inp}/></div>
                  <div><label style={lbl}>Email *</label><input value={contactForm.email} onChange={function(e){setContactForm(function(p){return Object.assign({},p,{email:e.target.value});});}} type="email" placeholder="Email" style={inp}/></div>

                <Btn onClick={addContact} label="Add Contact" disabled={!contactForm.name.trim()||!contactForm.email.trim()}/>

            {active.contacts.map(function(c){return (
              <div key={c.id} style={{background:"#fff",border:"1px solid #e2e8f0",borderRadius:8,padding:"12px 14px",display:"flex",alignItems:"center",gap:10,marginBottom:6}}>
                <div style={{flex:1}}><div style={{fontWeight:600,fontSize:14,color:"#0f172a"}}>{c.name}</div><div style={{fontSize:12,color:"#94a3b8"}}>{c.email}</div></div>
                <span style={{fontSize:11,background:c.type==="vendor"?"#fef3e2":"#eff6ff",color:c.type==="vendor"?"#b45309":"#2563eb",borderRadius:20,padding:"2px 8px"}}>{c.type}</span>
                <button onClick={function(){updateActive(function(p){return Object.assign({},p,{contacts:p.contacts.filter(function(x){return x.id!==c.id;})});});}} style={{background:"none",border:"none",color:"#cbd5e1",cursor:"pointer",fontSize:14}}>x</button>
              </div>
            );})}
          </div>
        )}
      </div>
    </div>
  );
}
</script>
<script type="text/babel">
function RoomTable(props) {
  const [collapsed,setCollapsed]=useState(false);
  const isMobile=useIsMobile();
  var sortCol=props.sortCol, sortDir=props.sortDir, onSortCol=props.onSortCol;
  const COL_DEFS=[
    {id:"component",label:"Component",w:"120px"},{id:"material",label:"Item Description",w:"1fr"},
    {id:"description",label:"Client Desc",w:"120px"},{id:"vendor",label:"Vendor",w:"90px"},
    {id:"brand",label:"Brand",w:"70px"},{id:"color",label:"Color",w:"70px"},
    {id:"finish",label:"Finish",w:"70px"},{id:"width",label:"W",w:"50px"},
    {id:"height",label:"H",w:"50px"},{id:"depth",label:"D",w:"50px"},
    {id:"qty",label:"Qty",w:"70px"},{id:"leadTime",label:"Lead Time",w:"80px"},
    {id:"status",label:"Status",w:"80px"},
  ];
  var activeCols=COL_DEFS.filter(function(c){return props.visibleCols.includes(c.id);});
  var cols="32px 36px "+activeCols.map(function(c){return c.w;}).join(" ");
  var headers=["","#"].concat(activeCols.map(function(c){return c.label;}));
  return (
    <div id={"room-"+props.room} style={{marginBottom:16,background:"#f8fafc"}}>
      <div style={{display:"flex",alignItems:"center",gap:8,padding:"8px 0",borderBottom:"2px solid #0f172a"}}>
        <button onClick={function(){setCollapsed(function(c){return !c;});}} style={{background:"none",border:"none",cursor:"pointer",fontSize:12,color:"#64748b",padding:"0 4px"}}>{collapsed?"[+]":"[-]"}</button>
        <span style={{fontWeight:700,fontSize:13,color:"#0f172a"}}>{props.room}</span>
        <span style={{fontSize:12,color:"#94a3b8"}}>{props.items.length}</span>
        <span style={{marginLeft:"auto",fontSize:12,color:"#94a3b8",cursor:"pointer"}} onClick={function(){setCollapsed(function(c){return !c;});}}>{collapsed?"Expand":"Collapse"}</span>
      </div>
      {!collapsed&&(
        <div>
          {!isMobile&&(
            <div style={{display:"grid",gridTemplateColumns:cols,background:"#f8fafc",borderBottom:"1px solid #e2e8f0"}}>
              {headers.map(function(h,i){
                var colId=activeCols[i-2]&&activeCols[i-2].id;
                var isActive=sortCol&&colId&&sortCol===colId;
                var clickable=i>=2&&colId&&onSortCol;
                return (
                  <div key={i} onClick={clickable?function(){onSortCol(colId);}:undefined} style={{padding:"6px 8px",fontSize:10,fontWeight:600,color:isActive?"#0f172a":"#94a3b8",textTransform:"uppercase",letterSpacing:"0.5px",whiteSpace:"nowrap",overflow:"hidden",cursor:clickable?"pointer":"default",userSelect:"none",display:"flex",alignItems:"center",gap:3}}>
                    {h}
                    {isActive&&<span style={{fontSize:9}}>{sortDir==="asc"?"^":"v"}</span>}
                    {!isActive&&clickable&&<span style={{fontSize:9,opacity:0.3}}>^</span>}
                  </div>
                );
              })}
            </div>
          )}
          {props.items.map(function(item,idx){return <ItemRow key={item.id} item={item} idx={idx} cols={cols} activeCols={activeCols} visibleCols={props.visibleCols} isMobile={isMobile} isEditing={props.editId===item.id} selected={props.selectedItems.includes(item.id)} onEdit={function(){props.onEdit(props.editId===item.id?null:item.id);}} onUpdate={function(patch){props.onUpdate(item.id,patch);}} onDelete={function(){props.onDelete(item.id);}} onToggleSelect={function(){props.onToggleSelect(item.id);}}/>;  })}
        </div>
      )}
    </div>
  );
}

function ItemRow(props) {
  var item=props.item, activeCols=props.activeCols, visibleCols=props.visibleCols;
  var sc=STATUS_CLR[item.status]||"#94a3b8";
  var getVal=function(id){
    if(id==="component")return item.component||"-";
    if(id==="material")return item.material||"(tap to edit)";
    if(id==="description")return item.description||"-";
    if(id==="vendor")return item.vendor||"-";
    if(id==="brand")return item.brand||"-";
    if(id==="color")return item.color||"-";
    if(id==="finish")return item.finish||"-";
    if(id==="width")return item.width||"-";
    if(id==="height")return item.height||"-";
    if(id==="depth")return item.depth||"-";
    if(id==="qty")return item.qty?item.qty+" "+item.unit:"-";
    if(id==="leadTime")return item.leadTime||"-";
    if(id==="status")return item.status||"Draft";
    return "-";
  };
  return (
    <div>
      {props.isMobile ? (
        <div style={{margin:"8px 10px",borderRadius:10,border:"1px solid #e2e8f0",background:props.isEditing?"#f8faff":"#fff",boxShadow:"0 1px 4px rgba(0,0,0,0.07)",overflow:"hidden"}}>
          {item.photos&&item.photos.length>0&&(
            <img src={item.photos[0].url} alt="" style={{width:"100%",height:140,objectFit:"cover",display:"block"}}/>
          )}
          <div style={{display:"flex",gap:10,padding:"12px 12px"}}>
            {(!item.photos||!item.photos.length)&&(
              <div style={{width:72,height:72,borderRadius:6,background:"#f1f5f9",flexShrink:0,display:"flex",alignItems:"center",justifyContent:"center"}}>
                <span style={{fontSize:20,color:"#cbd5e1"}}>[]</span>
              </div>
            )}
            <div style={{flex:1,minWidth:0}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:2}}>
                <div style={{fontWeight:600,fontSize:14,color:"#0f172a",lineHeight:1.3,paddingRight:8,flex:1,minWidth:0}}>{item.material||"(tap to edit)"}</div>
                <span onClick={function(e){e.stopPropagation();props.onUpdate({status:STATUS_OPTS[(STATUS_OPTS.indexOf(item.status)+1)%STATUS_OPTS.length]});}} style={{fontSize:10,fontWeight:600,color:sc,cursor:"pointer",flexShrink:0,whiteSpace:"nowrap"}}>{item.status}</span>
              </div>
              {item.component&&<div style={{fontSize:11,color:"#94a3b8",marginBottom:4}}>{item.component}</div>}
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"4px 8px",marginBottom:6}}>
                {visibleCols.filter(function(c){return c!=="material"&&c!=="status"&&c!=="component";}).map(function(colId){
                  var val=getVal(colId);
                  if(!val||val==="-")return null;
                  var colDef=activeCols.find(function(c){return c.id===colId;});
                  var label=colDef?colDef.label:colId;
                  return (
                    <div key={colId}>
                      <div style={{fontSize:10,color:"#94a3b8",textTransform:"uppercase",letterSpacing:"0.3px"}}>{label}</div>
                      <div style={{fontSize:12,color:"#0f172a",fontWeight:500}}>{val}</div>
                    </div>
                  );
                })}
              </div>
              <div style={{display:"flex",alignItems:"center",gap:6}}>
                <button onClick={props.onEdit} style={{flex:1,padding:"6px 10px",border:"1px solid #e2e8f0",borderRadius:6,background:"#fff",fontSize:12,color:"#0f172a",fontWeight:500,cursor:"pointer"}}>{props.isEditing?"Close":"Details"}</button>
                {item.website&&<a href={item.website.startsWith("http")?item.website:"https://"+item.website} target="_blank" rel="noreferrer" style={{padding:"6px 10px",borderRadius:6,background:"#eff6ff",border:"1px solid #bfdbfe",fontSize:12,color:"#1d4ed8",textDecoration:"none",whiteSpace:"nowrap",fontWeight:500}}>View Product</a>}
                <input type="checkbox" checked={props.selected} onChange={props.onToggleSelect} style={{accentColor:"#0f172a",width:16,height:16,flexShrink:0}}/>
                <button onClick={function(e){e.stopPropagation();if(window.confirm("Remove "+(item.material||"this item")+"?"))props.onDelete();}} style={{background:"none",border:"none",color:"#e2e8f0",cursor:"pointer",fontSize:16,padding:0,marginLeft:"auto"}}>x</button>
              </div>
            </div>
          </div>
        </div>
      ) : (
        <div style={{display:"grid",gridTemplateColumns:props.cols,borderBottom:"1px solid #f1f5f9",background:props.isEditing?"#fafbff":props.selected?"#f0f7ff":"#fff"}}>
          <div style={{padding:"8px 4px",display:"flex",alignItems:"center",justifyContent:"center"}}><input type="checkbox" checked={props.selected} onChange={props.onToggleSelect} style={{accentColor:"#0f172a"}}/></div>
          <div style={{padding:"8px",fontSize:12,color:"#94a3b8",display:"flex",alignItems:"center"}}>{props.idx+1}</div>
          {activeCols.map(function(col){
            if(col.id==="material")return (
              <div key={col.id} style={{padding:"6px 8px",display:"flex",flexDirection:"column",justifyContent:"center",minWidth:0,cursor:"pointer"}} onClick={props.onEdit}>
                <div style={{fontWeight:600,fontSize:13,color:"#0f172a",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{item.material||"(click to edit)"}</div>
                {item.description&&<div style={{fontSize:11,color:"#64748b",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis",marginTop:1}}>{item.description}</div>}
              </div>
            );
            if(col.id==="status")return (
              <div key={col.id} style={{padding:"6px 8px",display:"flex",alignItems:"center",gap:4}}>
                <span onClick={function(){props.onUpdate({status:STATUS_OPTS[(STATUS_OPTS.indexOf(item.status)+1)%STATUS_OPTS.length]});}} style={{fontSize:10,fontWeight:600,color:sc,cursor:"pointer",whiteSpace:"nowrap"}}>{item.status}</span>
                <button onClick={function(e){e.stopPropagation();if(window.confirm("Remove "+(item.material||"this item")+"?"))props.onDelete();}} style={{background:"none",border:"none",color:"#e2e8f0",cursor:"pointer",fontSize:12,padding:"0 2px"}}>x</button>
              </div>
            );
            return <div key={col.id} style={{padding:"6px 8px",fontSize:12,color:"#374151",display:"flex",alignItems:"center",overflow:"hidden"}}><span style={{whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{getVal(col.id)}</span></div>;
          })}
        </div>
      )}
      {props.isEditing&&(
        <div style={{background:"#f8fafc",borderBottom:"2px solid #e2e8f0",padding:"14px 16px"}}>
          <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:10,marginBottom:10}}>
            <div style={{gridColumn:"1/-1"}}><label style={lbl}>Item Description</label><input value={item.material} onChange={function(e){props.onUpdate({material:e.target.value});}} placeholder="Item name" style={inp}/></div>
            <div><label style={lbl}>Item Component</label><input value={item.component} onChange={function(e){props.onUpdate({component:e.target.value});}} placeholder="Component code" style={inp}/></div>
            <div><label style={lbl}>Room</label><input value={item.room} onChange={function(e){props.onUpdate({room:e.target.value});}} placeholder="Room" style={inp}/></div>
            <div><label style={lbl}>Client Description</label><input value={item.description} onChange={function(e){props.onUpdate({description:e.target.value});}} placeholder="Client description" style={inp}/></div>
            <div><label style={lbl}>Vendor</label><input value={item.vendor} onChange={function(e){props.onUpdate({vendor:e.target.value});}} placeholder="Vendor" style={inp}/></div>
            <div><label style={lbl}>Brand</label><input value={item.brand} onChange={function(e){props.onUpdate({brand:e.target.value});}} placeholder="Brand" style={inp}/></div>
            <div><label style={lbl}>Color</label><input value={item.color} onChange={function(e){props.onUpdate({color:e.target.value});}} placeholder="Color" style={inp}/></div>
            <div><label style={lbl}>Finish</label><input value={item.finish} onChange={function(e){props.onUpdate({finish:e.target.value});}} placeholder="Finish" style={inp}/></div>
          </div>
          <div style={{display:"grid",gridTemplateColumns:"repeat(6,1fr)",gap:10,marginBottom:10}}>
            <div><label style={lbl}>Qty</label><input value={item.qty} onChange={function(e){props.onUpdate({qty:e.target.value});}} type="number" min="0" placeholder="0" style={inp}/></div>
            <div><label style={lbl}>Unit</label><select value={item.unit} onChange={function(e){props.onUpdate({unit:e.target.value});}} style={inp}>{UNITS.map(function(u){return <option key={u}>{u}</option>;})}</select></div>
            <div><label style={lbl}>Width</label><input value={item.width} onChange={function(e){props.onUpdate({width:e.target.value});}} placeholder="Width" style={inp}/></div>
            <div><label style={lbl}>Height</label><input value={item.height} onChange={function(e){props.onUpdate({height:e.target.value});}} placeholder="Height" style={inp}/></div>
            <div><label style={lbl}>Depth</label><input value={item.depth} onChange={function(e){props.onUpdate({depth:e.target.value});}} placeholder="Depth" style={inp}/></div>
            <div><label style={lbl}>Lead Time</label><input value={item.leadTime} onChange={function(e){props.onUpdate({leadTime:e.target.value});}} placeholder="Lead time" style={inp}/></div>
          </div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:10,marginBottom:10}}>
            <div><label style={lbl}>Unit Trade Price ($)</label><input value={item.unitPrice||""} onChange={function(e){var up=e.target.value;var tp=up&&item.qty?((parseFloat(up)||0)*(parseFloat(item.qty)||0)*(1-(parseFloat(item.discount)||0)/100)).toFixed(2):"";props.onUpdate({unitPrice:up,totalPrice:tp});}} type="number" min="0" step="0.01" placeholder="0.00" style={inp}/></div>
            <div><label style={lbl}>Trade Discount (%)</label><input value={item.discount||""} onChange={function(e){var d=e.target.value;var tp=item.unitPrice&&item.qty?((parseFloat(item.unitPrice)||0)*(parseFloat(item.qty)||0)*(1-(parseFloat(d)||0)/100)).toFixed(2):"";props.onUpdate({discount:d,totalPrice:tp});}} type="number" min="0" max="100" step="0.1" placeholder="0" style={inp}/></div>
            <div><label style={lbl}>Total Price ($)</label><input value={item.totalPrice||""} readOnly style={Object.assign({},inp,{background:"#f8fafc",color:"#64748b"})}/></div>
          </div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:10}}>
            <div><label style={lbl}>Notes</label><input value={item.notes} onChange={function(e){props.onUpdate({notes:e.target.value});}} placeholder="Notes" style={inp}/></div>
            <div><label style={lbl}>Product link</label><input value={item.website} onChange={function(e){props.onUpdate({website:e.target.value});}} placeholder="Product link" style={inp}/></div>
          </div>
          {item.website&&(
            <div style={{display:"flex",gap:8,marginBottom:10}}>
              <a href={item.website.startsWith("http")?item.website:"https://"+item.website} target="_blank" rel="noreferrer" style={Object.assign({},bsty,{background:"#eff6ff",color:"#2563eb",textDecoration:"none"})}>Open Link</a>
              <button onClick={function(){copyText(item.website.startsWith("http")?item.website:"https://"+item.website);}} style={Object.assign({},bsty,{background:"#f1f5f9",color:"#64748b"})}>Copy URL</button>
            </div>
          )}
          <PhotoUpload item={item} onUpdate={props.onUpdate}/>
          <div style={{marginTop:10}}><button onClick={props.onEdit} style={Object.assign({},bsty,{background:"#0f172a",color:"#fff"})}>Done</button></div>
        </div>
      )}
    </div>
  );
}

function PhotoUpload(props) {
  var item=props.item, onUpdate=props.onUpdate;
  const [uploading,setUploading]=useState(false);
  const [lightbox,setLightbox]=useState(null);
  const [dragging,setDragging]=useState(false);
  const fileRef=useRef();
  var photos=item.photos||[];

  var upload=async function(files){
    if(!files||!files.length)return;
    setUploading(true);
    try{
      var uploaded=[];
      if(hasFirebase()){
        var sref=firebase.storage().ref();
        for(var i=0;i<files.length;i++){
          var file=files[i];
          var ext=file.name.split(".").pop();
          var path="items/"+item.id+"/"+Date.now()+"_"+Math.random().toString(36).slice(2)+"."+ext;
          var ref=sref.child(path);
          await ref.put(file);
          var url=await ref.getDownloadURL();
          uploaded.push({url:url,path:path,name:file.name});
        }
      }else{
        for(var i=0;i<files.length;i++){
          var file=files[i];
          var url=await new Promise(function(res,rej){var r=new FileReader();r.onload=function(e){res(e.target.result);};r.onerror=rej;r.readAsDataURL(file);});
          uploaded.push({url:url,path:"local_"+Date.now()+"_"+file.name,name:file.name});
        }
      }
      onUpdate({photos:[...photos,...uploaded]});
    }catch(e){alert("Upload failed: "+e.message);}
    setUploading(false);
    if(fileRef.current)fileRef.current.value="";
  };

  var remove=async function(photo){
    try{if(hasFirebase()&&!photo.path.startsWith("local_")){await firebase.storage().ref(photo.path).delete();}}catch(e){}
    onUpdate({photos:photos.filter(function(p){return p.path!==photo.path;})});
  };

  return (
    <div>
      {photos.length>0&&(
        <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:8}}>
          {photos.map(function(ph,i){return (
            <div key={ph.path} style={{position:"relative",width:56,height:56}}>
              <img src={ph.url} alt="" onClick={function(){setLightbox(i);}} style={{width:56,height:56,objectFit:"cover",borderRadius:6,cursor:"pointer",border:"1px solid #e2e8f0"}}/>
              <button onClick={function(){remove(ph);}} style={{position:"absolute",top:-5,right:-5,width:16,height:16,borderRadius:"50%",background:"#ef4444",border:"none",color:"#fff",fontSize:9,cursor:"pointer",padding:0,lineHeight:1}}>x</button>
            </div>
          );})}
        </div>
      )}
      <input ref={fileRef} type="file" accept="image/*" multiple style={{display:"none"}} onChange={function(e){upload(e.target.files);}}/>
      <div onDrop={function(e){e.preventDefault();e.stopPropagation();setDragging(false);var files=e.dataTransfer&&e.dataTransfer.files;if(files&&files.length)upload(files);}} onDragOver={function(e){e.preventDefault();e.stopPropagation();setDragging(true);}} onDragLeave={function(e){e.preventDefault();setDragging(false);}} onClick={function(){fileRef.current&&fileRef.current.click();}} style={{display:"flex",alignItems:"center",justifyContent:"center",gap:8,padding:"10px 16px",border:"2px dashed "+(dragging?"#3b82f6":"#e2e8f0"),borderRadius:8,background:dragging?"#eff6ff":"#f8fafc",cursor:"pointer",color:dragging?"#3b82f6":"#64748b",fontSize:13}}>
        {uploading?"Uploading...":dragging?"Drop to upload":photos.length>0?"+ Add more photos ("+photos.length+" saved)":"+ Add photos or drag & drop"}
      </div>
      {lightbox!==null&&(
        <div onClick={function(){setLightbox(null);}} style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.9)",zIndex:1000,display:"flex",alignItems:"center",justifyContent:"center",flexDirection:"column",gap:10}}>
          <button onClick={function(){setLightbox(null);}} style={{position:"absolute",top:16,right:16,background:"none",border:"none",color:"#fff",fontSize:24,cursor:"pointer"}}>x</button>
          <img src={photos[lightbox]&&photos[lightbox].url} alt="" onClick={function(e){e.stopPropagation();}} style={{maxWidth:"90vw",maxHeight:"75vh",borderRadius:8,objectFit:"contain"}}/>
          {photos.length>1&&(
            <div style={{display:"flex",gap:8,alignItems:"center"}}>
              <button onClick={function(e){e.stopPropagation();setLightbox(function(l){return (l-1+photos.length)%photos.length;});}} style={{background:"rgba(255,255,255,0.2)",border:"none",color:"#fff",fontSize:20,borderRadius:6,padding:"4px 12px",cursor:"pointer"}}>{"<"}</button>
              <span style={{color:"#fff",fontSize:13}}>{lightbox+1}/{photos.length}</span>
              <button onClick={function(e){e.stopPropagation();setLightbox(function(l){return (l+1)%photos.length;});}} style={{background:"rgba(255,255,255,0.2)",border:"none",color:"#fff",fontSize:20,borderRadius:6,padding:"4px 12px",cursor:"pointer"}}>{">"}</button>
            </div>
          )}
        </div>
      )}
    </div>
  );
}
const root=ReactDOM.createRoot(document.getElementById("root"));
root.render(<App/>);
</script>
